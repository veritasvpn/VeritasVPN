version: '3.9'

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    ports: !reset []
    command: redis-server --appendonly no --maxmemory-policy allkeys-lru --maxmemory 64mb --requirepass ${REDIS_PASSWORD:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD:-}", "ping"]

  nats:
    ports: !reset []
    command: -js -m 8222
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - natsdata:/data

  auth-svc:
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      LOG_LEVEL: info
      LOG_FORMAT: json
      ENVIRONMENT: production
      CORS_ORIGINS: https://veritasvpn.cloud,https://www.veritasvpn.cloud
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      retries: 3

  wg-manager:
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      LOG_LEVEL: info
      LOG_FORMAT: json
      ENVIRONMENT: production
      CORS_ORIGINS: https://veritasvpn.cloud,https://www.veritasvpn.cloud
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      retries: 3

  billing-svc:
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      LOG_LEVEL: info
      LOG_FORMAT: json
      ENVIRONMENT: production
      CORS_ORIGINS: https://veritasvpn.cloud,https://www.veritasvpn.cloud
      ALLOW_MOCK_BTCPAY: "false"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      retries: 3

  veritas-agent:
    environment:
      LOG_LEVEL: info
      MANAGER_ENDPOINT: http://127.0.0.1:8082
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "ip link show wg0 >/dev/null 2>&1 && ss -lntu | grep -q 51820"]
      interval: 15s
      retries: 3
      start_period: 30s

  veritas-proxy:
    ports:
      - "0.0.0.0:1080:1080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    ports:
      - "127.0.0.1:80:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 10s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2025.6.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
  btcpay_default:
    external: true

volumes:
  pgdata:
  natsdata:
