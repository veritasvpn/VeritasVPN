syntax = "proto3";

package agent.v1;

option go_package = "github.com/veritasvpn/api/gen/agent/v1;agentv1";

service AgentService {
  rpc RegisterServer(RegisterServerRequest) returns (RegisterServerResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc StreamPeerUpdates(PeerUpdateStreamRequest) returns (stream PeerUpdate);
  rpc ReportMetrics(MetricsReportRequest) returns (MetricsReportResponse);
}

message RegisterServerRequest {
  string hostname = 1;
  string public_key = 2;
  string public_ip = 3;
  int32 wg_port = 4;
  string region = 5;
  string city = 6;
  string country = 7;
  string auth_token = 8;
}

message RegisterServerResponse {
  string server_id = 1;
  string wg_subnet = 2;
  string dns_server = 3;
  int32 capacity = 4;
}

message HeartbeatRequest {
  string server_id = 1;
  int32 peer_count = 2;
  double load_factor = 3;
  int64 rx_bytes = 4;
  int64 tx_bytes = 5;
}

message HeartbeatResponse {
  bool ok = 1;
}

message PeerUpdateStreamRequest {
  string server_id = 1;
  string auth_token = 2;
}

message PeerUpdate {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_ADD = 1;
    ACTION_REMOVE = 2;
  }
  Action action = 1;
  string peer_id = 2;
  string public_key = 3;
  string preshared_key = 4;
  repeated string allowed_ips = 5;
}

message MetricsReportRequest {
  string server_id = 1;
  int64 timestamp = 2;
  int64 rx_bytes = 3;
  int64 tx_bytes = 4;
  int32 peer_count = 5;
  double cpu_usage = 6;
  double memory_usage = 7;
}

message MetricsReportResponse {
  bool ok = 1;
}
