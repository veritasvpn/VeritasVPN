name: External VPN end-to-end

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  # Serialize with tunnel-hold / vpn-e2e so logout-all does not race the same account.
  group: veritas-e2e-account
  cancel-in-progress: false

jobs:
  wireguard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install WireGuard test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wireguard-tools dnsutils jq curl
      - name: Test authentication, provisioning, tunnel, DNS, egress and revocation
        env:
          VERITAS_E2E_ACCOUNT_ID: ${{ secrets.VERITAS_E2E_ACCOUNT_ID }}
          VERITAS_E2E_AUTH_SECRET: ${{ secrets.VERITAS_E2E_AUTH_SECRET }}
        run: sudo --preserve-env=VERITAS_E2E_ACCOUNT_ID,VERITAS_E2E_AUTH_SECRET deploy/verify/external-wireguard-e2e.sh
      - name: Tell Telegram the WireGuard test failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +x
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets are unset; skipping the failure notice."
            exit 0
          fi
          payload=$(jq -n \
            --arg chat "$TELEGRAM_CHAT_ID" \
            --arg text "VeritasVPN hourly WireGuard test failed. Open the vpn-e2e workflow run for details." \
            '{chat_id:$chat, text:$text}')
          code=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 15 \
            --header "Content-Type: application/json" \
            --data "$payload" \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" || true)
          if [ "$code" != "200" ]; then
            echo "Telegram notification could not be sent."
          fi
