name: Deploy Website

on:
  push:
    branches: [master, main]
    paths:
      - "website/**"
      - ".github/workflows/pages-deploy.yml"

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare deploy directory
        run: |
          (cd website/downloads && sha256sum --check SHA256SUMS)
          unzip -t website/downloads/veritasvpn-chrome.zip >/dev/null
          test "$(unzip -p website/downloads/veritasvpn-chrome.zip manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')" = "0.3.6"
          mkdir -p dist-site
          # Pages has a 25 MiB per-file limit; the APK is streamed by a Pages Function.
          rsync -a \
            --exclude 'downloads/veritasvpn-linux.AppImage' \
            --exclude 'downloads/veritasvpn-linux.deb' \
            --exclude 'downloads/VeritasVPN_*.AppImage' \
            --exclude 'downloads/VeritasVPN_*.deb' \
            --exclude 'downloads/veritasvpn-android.apk' \
            --exclude 'downloads/veritasvpn-chrome.zip' \
            --exclude 'downloads/SHA256SUMS' \
            --exclude 'downloads/veritasvpn-macos.dmg' \
            --exclude 'functions' \
            --exclude 'README.md' \
            --exclude '.gitignore' \
            website/ dist-site/
          # Wrangler discovers Pages Functions from the project root.
          cp -a website/functions ./functions

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 368cad600fc530d1a254d3121850d5b9
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error --output /dev/null \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/veritasvpn"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 368cad600fc530d1a254d3121850d5b9
        run: npx --yes wrangler@4.31.0 pages deploy dist-site/ --project-name=veritasvpn --branch=master
