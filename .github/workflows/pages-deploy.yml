name: Deploy Website

on:
  push:
    branches: [master, main]
    paths:
      - "website/**"
      - "scripts/build-learn.py"
      - ".github/workflows/pages-deploy.yml"

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Learn education pages
        run: python3 scripts/build-learn.py

      - name: Prepare deploy directory
        run: |
          (cd website/downloads && sha256sum --check --ignore-missing SHA256SUMS)
          unzip -t website/downloads/veritasvpn-chrome.zip >/dev/null
          test "$(unzip -p website/downloads/veritasvpn-chrome.zip manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')" = "0.3.7"
          mkdir -p dist-site
          # Pages has a 25 MiB per-file limit; the APK is streamed by a Pages Function.
          rsync -a \
            --exclude 'downloads/veritasvpn-linux.AppImage' \
            --exclude 'downloads/veritasvpn-linux.deb' \
            --exclude 'downloads/VeritasVPN_*.AppImage' \
            --exclude 'downloads/VeritasVPN_*.deb' \
            --exclude 'downloads/veritasvpn-android.apk' \
            --exclude 'downloads/veritasvpn-chrome.zip' \
            --exclude 'downloads/SHA256SUMS' \
            --exclude 'downloads/veritasvpn-macos.dmg' \
            --exclude 'functions' \
            --exclude 'README.md' \
            --exclude '.gitignore' \
            --exclude 'learn/content' \
            website/ dist-site/
          # Wrangler discovers Pages Functions from the project root.
          cp -a website/functions ./functions

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 368cad600fc530d1a254d3121850d5b9
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error --output /dev/null \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/veritasvpn"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 368cad600fc530d1a254d3121850d5b9
          PAGES_BRANCH: ${{ github.ref_name }}
          PAGES_COMMIT: ${{ github.sha }}
          PAGES_MESSAGE: ${{ github.event.head_commit.message }}
        # Deploy to the git branch so master updates production (custom domain).
        # Without --branch, Wrangler may create a preview-only upload.
        run: >
          npx --yes wrangler@4.31.0 pages deploy dist-site/
          --project-name=veritasvpn
          --branch="$PAGES_BRANCH"
          --commit-hash="$PAGES_COMMIT"
          --commit-message="$PAGES_MESSAGE"
          --commit-dirty=true
