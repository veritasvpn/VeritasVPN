name: Build supported VeritasVPN clients

on:
  push:
    tags:
      - 'v*'
      # v* tag creation is restricted. linux-v* publishes Linux only.
      # android-v* publishes the website APK only, same restriction.
      - 'linux-v*'
      - 'android-v*'
  workflow_dispatch:
    inputs:
      linux_only:
        description: Publish only the Linux deb and AppImage
        type: boolean
        default: false
      tag:
        description: Release tag to create, such as v0.2.83
        type: string
        required: false

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify trusted release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require master ancestry and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-release-source.sh

  build-linux:
    needs: verify-source
    name: Linux desktop
    # android-v* is the website APK. Do not rebuild the Linux packages.
    if: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev patchelf
      - name: Bundle WireGuard Go
        run: bash scripts/bundle-wg-linux.sh
        working-directory: clients/desktop
      - name: Bundle wstunnel for Stealth mode
        run: bash scripts/bundle-wstunnel-linux.sh
        working-directory: clients/desktop
      - name: Install and audit dependencies
        run: |
          npm ci
          npm audit --audit-level=high
        working-directory: clients/desktop
      - name: Build release packages
        run: npx tauri build
        working-directory: clients/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veritasvpn-linux-deb
          path: clients/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veritasvpn-linux-appimage
          path: clients/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-android:
    needs: verify-source
    name: Signed Android release artifacts
    # v0.2.83 / linux-v0.2.83 is the Linux device-identity release. Do not sign or upload Android.
    if: ${{ github.ref_name != 'v0.2.83' && github.ref_name != 'linux-v0.2.83' && (github.event_name != 'workflow_dispatch' || inputs.linux_only != true) }}
    runs-on: ubuntu-latest
    environment: android-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME:?ANDROID_HOME is required}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/veritasvpn-release.p12"
          chmod 600 "$RUNNER_TEMP/veritasvpn-release.p12"
      - name: Test and assemble signed release artifacts
        env:
          ORG_GRADLE_PROJECT_VERITAS_RELEASE_STORE_FILE: ${{ runner.temp }}/veritasvpn-release.p12
          ORG_GRADLE_PROJECT_VERITAS_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_VERITAS_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_VERITAS_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease bundleRelease --no-daemon
        working-directory: android
      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
        working-directory: android
      - name: Verify website APK version and purchase history
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          expected="${GITHUB_REF_NAME#android-v}"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          badging="$("$AAPT" dump badging app/build/outputs/apk/release/app-release.apk)"
          printf '%s\n' "$badging" | grep -q "versionName='${expected}'"
          python3 ../scripts/verify-android-purchase-history-apk.py app/build/outputs/apk/release/app-release.apk
        working-directory: android
      - name: Verify Android App Bundle signature
        # App bundles are JAR-signed. Verify their integrity and signer without
        # requiring the release certificate to chain to a public CA.
        run: jarsigner -verify -certs app/build/outputs/bundle/release/app-release.aab
        working-directory: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veritasvpn-android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veritasvpn-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/veritasvpn-release.p12"

  build-chrome:
    needs: verify-source
    name: Chrome extension bundle
    if: ${{ github.ref_name != 'v0.2.83' && github.ref_name != 'linux-v0.2.83' && !startsWith(github.ref, 'refs/tags/android-v') && (github.event_name != 'workflow_dispatch' || inputs.linux_only != true) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate and package
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('clients/browser-extension/manifest.json'));if(m.manifest_version!==3)throw new Error('Manifest V3 required');if(m.host_permissions.includes('<all_urls>'))throw new Error('Broad <all_urls> permission is not allowed');"
          node --input-type=module --check < clients/browser-extension/js/background.js
          node --input-type=module --check < clients/browser-extension/js/popup.js
          node --input-type=module --check < clients/browser-extension/js/auth.js
          mkdir -p "$RUNNER_TEMP/chrome"
          cp -R clients/browser-extension/. "$RUNNER_TEMP/chrome/"
          rm -rf "$RUNNER_TEMP/chrome/store-assets"
          cd "$RUNNER_TEMP/chrome"
          zip -qr "$GITHUB_WORKSPACE/veritasvpn-chrome.zip" . -x '*.DS_Store'
          unzip -t "$GITHUB_WORKSPACE/veritasvpn-chrome.zip" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veritasvpn-chrome
          path: veritasvpn-chrome.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-linux, build-android]
    if: >-
      ${{
        always() &&
        (
          (
            needs.build-linux.result == 'success' &&
            (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') &&
            (
              startsWith(github.ref, 'refs/tags/v') ||
              startsWith(github.ref, 'refs/tags/linux-v') ||
              (github.event_name == 'workflow_dispatch' && inputs.linux_only == true)
            )
          ) ||
          (
            needs.build-android.result == 'success' &&
            needs.build-linux.result == 'skipped' &&
            startsWith(github.ref, 'refs/tags/android-v')
          )
        )
      }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      LINUX_ONLY: ${{ (github.ref_name == 'v0.2.83' || github.ref_name == 'linux-v0.2.83' || (github.event_name == 'workflow_dispatch' && inputs.linux_only == true)) && 'true' || 'false' }}
      ANDROID_ONLY: ${{ startsWith(github.ref, 'refs/tags/android-v') && 'true' || 'false' }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Reject replacement of an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_TAG" in
            android-v[0-9]*.[0-9]*.[0-9]*|linux-v[0-9]*.[0-9]*.[0-9]*|v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tag must look like v0.2.84, linux-v0.2.83, or android-v0.2.84, got: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists and must not be replaced." >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Stage and verify every supported artifact
        run: |
          if [ "$ANDROID_ONLY" = "true" ]; then
            APK="$(find artifacts/veritasvpn-android -type f -name '*.apk' -print -quit)"
            AAB="$(find artifacts/veritasvpn-android-aab -type f -name '*.aab' -print -quit)"
            test -n "$APK" && test -n "$AAB"
            cp "$APK" veritasvpn-android.apk
            cp "$AAB" veritasvpn-android.aab
            case "$RELEASE_TAG" in
              android-v*) expected_version="${RELEASE_TAG#android-v}" ;;
              *) echo "Unsupported Android release tag: $RELEASE_TAG" >&2; exit 1 ;;
            esac
            echo "Publishing Android ${expected_version} without Linux packages"
            sha256sum veritasvpn-android.apk veritasvpn-android.aab > SHA256SUMS
          else
            DEB="$(find artifacts/veritasvpn-linux-deb -type f -name '*.deb' -print -quit)"
            APPIMAGE="$(find artifacts/veritasvpn-linux-appimage -type f -name '*.AppImage' -print -quit)"
            test -n "$DEB" && test -n "$APPIMAGE"
            cp "$DEB" veritasvpn-linux.deb
            cp "$APPIMAGE" veritasvpn-linux.AppImage
            case "$RELEASE_TAG" in
              linux-v*) expected_version="${RELEASE_TAG#linux-v}" ;;
              v*) expected_version="${RELEASE_TAG#v}" ;;
              *) echo "Unsupported release tag: $RELEASE_TAG" >&2; exit 1 ;;
            esac
            dpkg-deb -f veritasvpn-linux.deb Version | grep -qx "$expected_version"
            if [ "$LINUX_ONLY" = "true" ]; then
              sha256sum veritasvpn-linux.deb veritasvpn-linux.AppImage > SHA256SUMS
            else
              APK="$(find artifacts/veritasvpn-android -type f -name '*.apk' -print -quit)"
              AAB="$(find artifacts/veritasvpn-android-aab -type f -name '*.aab' -print -quit)"
              test -n "$APK" && test -n "$AAB"
              cp "$APK" veritasvpn-android.apk
              cp "$AAB" veritasvpn-android.aab
              sha256sum veritasvpn-linux.deb veritasvpn-linux.AppImage veritasvpn-android.apk veritasvpn-android.aab > SHA256SUMS
            fi
          fi
          sha256sum --check SHA256SUMS
      - name: Attest Android packages
        if: env.ANDROID_ONLY == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            veritasvpn-android.apk
            veritasvpn-android.aab
            SHA256SUMS
      - name: Attest Linux packages
        if: env.LINUX_ONLY == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            veritasvpn-linux.deb
            veritasvpn-linux.AppImage
            SHA256SUMS
      - name: Attest supported client packages
        if: env.LINUX_ONLY != 'true' && env.ANDROID_ONLY != 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            veritasvpn-linux.deb
            veritasvpn-linux.AppImage
            veritasvpn-android.apk
            veritasvpn-android.aab
            SHA256SUMS
      - name: Create Linux-only GitHub release
        if: env.LINUX_ONLY == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG == 'linux-v0.2.83' && 'v0.2.83' || env.RELEASE_TAG }}
          # Linux-only. Leave the Android website release as GitHub "latest" so
          # production smoke keeps comparing that APK to the live download.
          make_latest: false
          body: |
            Linux desktop packages that report platform and hostname on the account devices page.
            Android, Chrome, macOS, and Windows are not part of this release.
          fail_on_unmatched_files: true
          files: |
            veritasvpn-linux.deb
            veritasvpn-linux.AppImage
            SHA256SUMS
      - name: Create Android-only GitHub release
        if: env.ANDROID_ONLY == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_name == 'android-v0.2.84' && 'v0.2.84' || github.ref_name }}
          # This is the website APK, so production smoke should check it once
          # the install page pin matches. Linux packages are not replaced.
          make_latest: true
          body: |
            Signed Android website build. Purchase history JSON names are kept through release shrinking.
            Linux packages stay on linux-v0.2.83. Google Play is not part of this release.
          fail_on_unmatched_files: true
          files: |
            veritasvpn-android.apk
            veritasvpn-android.aab
            SHA256SUMS
      - name: Create GitHub release
        if: env.LINUX_ONLY != 'true' && env.ANDROID_ONLY != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          files: |
            veritasvpn-linux.deb
            veritasvpn-linux.AppImage
            veritasvpn-android.apk
            veritasvpn-android.aab
            SHA256SUMS
