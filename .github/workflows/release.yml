name: Build supported VeritasVPN clients

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev patchelf
      - name: Bundle WireGuard Go
        run: bash scripts/bundle-wg-linux.sh
        working-directory: clients/desktop
      - name: Install and audit dependencies
        run: |
          npm ci
          npm audit --audit-level=high
        working-directory: clients/desktop
      - name: Build release packages
        run: npx tauri build
        working-directory: clients/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veritasvpn-linux-deb
          path: clients/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veritasvpn-linux-appimage
          path: clients/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-android:
    name: Signed Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/veritasvpn-release.p12"
          chmod 600 "$RUNNER_TEMP/veritasvpn-release.p12"
      - name: Test and assemble signed release
        env:
          ORG_GRADLE_PROJECT_VERITAS_RELEASE_STORE_FILE: ${{ runner.temp }}/veritasvpn-release.p12
          ORG_GRADLE_PROJECT_VERITAS_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_VERITAS_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_VERITAS_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease --no-daemon
        working-directory: android
      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
        working-directory: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veritasvpn-android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  build-chrome:
    name: Chrome extension bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate and package
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('clients/browser-extension/manifest.json'));if(m.manifest_version!==3)throw new Error('Manifest V3 required');if(m.host_permissions.includes('<all_urls>'))throw new Error('Broad <all_urls> permission is not allowed');"
          node --input-type=module --check < clients/browser-extension/js/background.js
          node --input-type=module --check < clients/browser-extension/js/popup.js
          node --input-type=module --check < clients/browser-extension/js/auth.js
          mkdir -p "$RUNNER_TEMP/chrome"
          cp -R clients/browser-extension/. "$RUNNER_TEMP/chrome/"
          cd "$RUNNER_TEMP/chrome"
          zip -qr "$GITHUB_WORKSPACE/veritasvpn-chrome.zip" . -x '*.DS_Store'
          unzip -t "$GITHUB_WORKSPACE/veritasvpn-chrome.zip" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veritasvpn-chrome
          path: veritasvpn-chrome.zip
          if-no-files-found: error

  release:
    name: Publish complete supported release
    needs: [build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Stage and verify every supported artifact
        run: |
          DEB="$(find artifacts/veritasvpn-linux-deb -type f -name '*.deb' -print -quit)"
          APPIMAGE="$(find artifacts/veritasvpn-linux-appimage -type f -name '*.AppImage' -print -quit)"
          APK="$(find artifacts/veritasvpn-android -type f -name '*.apk' -print -quit)"
          test -n "$DEB" && test -n "$APPIMAGE" && test -n "$APK"
          cp "$DEB" veritasvpn-linux.deb
          cp "$APPIMAGE" veritasvpn-linux.AppImage
          cp "$APK" veritasvpn-android.apk
          sha256sum veritasvpn-linux.deb veritasvpn-linux.AppImage veritasvpn-android.apk > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            veritasvpn-linux.deb
            veritasvpn-linux.AppImage
            veritasvpn-android.apk
            SHA256SUMS
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          files: |
            veritasvpn-linux.deb
            veritasvpn-linux.AppImage
            veritasvpn-android.apk
            SHA256SUMS
