name: Build VeritasVPN Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Bundle WireGuard Go (macOS)
        run: bash scripts/bundle-wg-macos.sh
        working-directory: clients/desktop

      - name: Install dependencies
        run: npm ci
        working-directory: clients/desktop

      - name: Build .dmg
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npx tauri build
        working-directory: clients/desktop

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: veritasvpn-macos
          path: clients/desktop/src-tauri/target/release/bundle/dmg/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev patchelf

      - name: Bundle WireGuard Go (Linux)
        run: bash scripts/bundle-wg-linux.sh
        working-directory: clients/desktop

      - name: Install dependencies
        run: npm ci
        working-directory: clients/desktop

      - name: Build .deb and .AppImage
        run: npx tauri build
        working-directory: clients/desktop

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: veritasvpn-linux-deb
          path: clients/desktop/src-tauri/target/release/bundle/deb/*.deb

      - name: Upload .AppImage
        uses: actions/upload-artifact@v4
        with:
          name: veritasvpn-linux-appimage
          path: clients/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci
        working-directory: clients/desktop

      - name: Build .exe and .msi
        run: npx tauri build
        working-directory: clients/desktop

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: veritasvpn-windows-exe
          path: clients/desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload .msi
        uses: actions/upload-artifact@v4
        with:
          name: veritasvpn-windows-msi
          path: clients/desktop/src-tauri/target/release/bundle/msi/*.msi

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build WireGuard Go for Android
        run: bash build-wg-android.sh
        working-directory: android

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/veritasvpn-release.p12"
          chmod 600 "$RUNNER_TEMP/veritasvpn-release.p12"

      - name: Assemble signed release APK
        env:
          ORG_GRADLE_PROJECT_VERITAS_RELEASE_STORE_FILE: ${{ runner.temp }}/veritasvpn-release.p12
          ORG_GRADLE_PROJECT_VERITAS_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_VERITAS_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_VERITAS_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
        working-directory: android

      - name: Verify release signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veritasvpn-android
          path: android/app/build/outputs/apk/release/app-release.apk

  release:
    needs: [build-macos, build-linux, build-windows, build-android]
    if: always() && startsWith(github.ref, 'refs/tags/v') && (needs.build-linux.result == 'success' || needs.build-macos.result == 'success' || needs.build-windows.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Rename available assets
        run: |
          set -e
          if ls veritasvpn-macos/*.dmg 1>/dev/null 2>&1; then
            cp "$(ls veritasvpn-macos/*.dmg | head -1)" veritasvpn-macos.dmg
          fi
          if ls veritasvpn-linux-deb/*.deb 1>/dev/null 2>&1; then
            cp "$(ls veritasvpn-linux-deb/*.deb | head -1)" veritasvpn-linux.deb
          fi
          if ls veritasvpn-linux-appimage/*.AppImage 1>/dev/null 2>&1; then
            cp "$(ls veritasvpn-linux-appimage/*.AppImage | head -1)" veritasvpn-linux.AppImage
          fi
          if ls veritasvpn-windows-exe/*.exe 1>/dev/null 2>&1; then
            cp "$(ls veritasvpn-windows-exe/*.exe | head -1)" VeritasVPN-Windows.exe
          fi
          if ls veritasvpn-windows-msi/*.msi 1>/dev/null 2>&1; then
            cp "$(ls veritasvpn-windows-msi/*.msi | head -1)" VeritasVPN-Windows.msi
          fi
          if ls veritasvpn-android/*.apk 1>/dev/null 2>&1; then
            cp "$(ls veritasvpn-android/*.apk | head -1)" veritasvpn-android.apk
          fi
          ls -lh veritasvpn-* VeritasVPN-* 2>/dev/null || true
          sha256sum veritasvpn-* VeritasVPN-* 2>/dev/null > SHA256SUMS || true
          test -s SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            veritasvpn-macos.dmg
            veritasvpn-linux.deb
            veritasvpn-linux.AppImage
            VeritasVPN-Windows.exe
            VeritasVPN-Windows.msi
            veritasvpn-android.apk
            SHA256SUMS
          fail_on_unmatched_files: false
