name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Start every job with the least privilege required. Jobs that publish releases
# or images explicitly request their additional permission below.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: veritas
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        env:
          DATABASE_URL: postgres://veritas:ci-test-password@localhost:5432/veritas?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-for-ci-purposes-only
          AGENT_AUTH_TOKEN: test-agent-token
        run: |
          go test ./api/... ./lib/config/... ./lib/logging/... ./lib/crypto/... ./lib/jwt/... ./services/auth-svc/... ./services/wg-manager/... ./services/billing-svc/... ./services/veritas-agent/... ./services/browser-proxy/... ./services/bitcoin-readiness/... ./clients/cli/... -v -count=1 && go test ./services/telegram-notifier/... -v -count=1
          go vet ./api/... ./lib/config/... ./lib/logging/... ./lib/crypto/... ./lib/jwt/... ./services/auth-svc/... ./services/wg-manager/... ./services/billing-svc/... ./services/veritas-agent/... ./services/browser-proxy/... ./services/bitcoin-readiness/... ./clients/cli/...

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run govulncheck
        run: |
          for module in api lib/config lib/logging lib/crypto lib/jwt services/auth-svc services/wg-manager services/billing-svc services/veritas-agent services/browser-proxy clients/cli; do
            (cd "$module" && go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...)
          done

  build-services:
    name: Build Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-svc, wg-manager, billing-svc, veritas-agent, browser-proxy]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build ${{ matrix.service }}
        run: |
          case "${{ matrix.service }}" in
            auth-svc) go build ./services/auth-svc/cmd/server/ ;;
            wg-manager) go build ./services/wg-manager/cmd/server/ ;;
            billing-svc) go build ./services/billing-svc/cmd/server/ ;;
            veritas-agent) go build ./services/veritas-agent/cmd/agent/ ;;
            browser-proxy) go build ./services/browser-proxy/ ;;
          esac

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build CLI (${{ matrix.os }}/${{ matrix.arch }})
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p build
          go build -o build/veritas-${{ matrix.os }}-${{ matrix.arch }} ./clients/cli/cmd/

      - uses: actions/upload-artifact@v4
        with:
          name: veritas-${{ matrix.os }}-${{ matrix.arch }}
          path: build/veritas-${{ matrix.os }}-${{ matrix.arch }}

  build-desktop:
    name: Build desktop web bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - run: npm ci
      - run: npm run build

  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Assemble and test Android app
        working-directory: android
        run: ./gradlew test assembleDebug --no-daemon

  validate-website-extension:
    name: Validate website and Chrome extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate extension manifest and bundle
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('clients/browser-extension/manifest.json')); if(m.manifest_version!==3) throw new Error('Manifest V3 required'); if(m.host_permissions.includes('<all_urls>')) throw new Error('Broad <all_urls> permission is not allowed');"
          test -f clients/browser-extension/popup.html
          test -f clients/browser-extension/js/background.js
          node --check clients/browser-extension/js/background.js
          node --check clients/browser-extension/js/popup.js
          node --check clients/browser-extension/js/auth.js
          mkdir -p "$RUNNER_TEMP/veritasvpn-extension"
          cp -R clients/browser-extension/. "$RUNNER_TEMP/veritasvpn-extension/"
          (cd "$RUNNER_TEMP/veritasvpn-extension" && zip -qr "$RUNNER_TEMP/veritasvpn-extension.zip" .)
          unzip -t "$RUNNER_TEMP/veritasvpn-extension.zip" >/dev/null
      - name: Validate website entry points
        run: |
          test -f website/index.html
          test -f website/privacy.html
          grep -q 'Content-Security-Policy' website/_headers
          ! grep -RIn 'minlength="6"' website clients/browser-extension
      - name: Validate shell scripts
        run: |
          find deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Reject mutable production image tags
        run: |
          ! grep -RInE 'newTag: latest|image: .*:latest' deploy/k8s/base deploy/k8s/overlays/prod

  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: auth-svc
            dockerfile: services/auth-svc/Dockerfile
            context: .
          - service: wg-manager
            dockerfile: services/wg-manager/Dockerfile
            context: .
          - service: billing-svc
            dockerfile: services/billing-svc/Dockerfile
            context: .
          - service: veritas-agent
            dockerfile: services/veritas-agent/Dockerfile
            context: .
          - service: veritas-proxy
            dockerfile: containers/proxy-gateway/Dockerfile
            context: containers/proxy-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set registry owner (lowercase)
        run: echo "REGISTRY_OWNER=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.REGISTRY_OWNER }}/veritasvpn/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
