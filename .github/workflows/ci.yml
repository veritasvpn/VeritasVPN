name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Start every job with the least privilege required. Jobs that publish releases
# or images explicitly request their additional permission below.
permissions:
  contents: read

env:
  GO_VERSION: "1.25.13"
  TRIVY_VERSION: "0.74.0"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: veritas
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Agents edge must 404 (no proxy_pass)
        run: |
          chmod +x deploy/ops/verify-agents-nginx-404.sh
          bash deploy/ops/verify-agents-nginx-404.sh

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        env:
          DATABASE_URL: postgres://veritas:ci-test-password@localhost:5432/veritas?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          AGENT_AUTH_TOKEN: test-agent-token
        run: |
          go test ./api/... ./lib/config/... ./lib/logging/... ./lib/crypto/... ./lib/jwt/... ./services/auth-svc/... ./services/wg-manager/... ./services/billing-svc/... ./services/veritas-agent/... ./services/browser-proxy/... ./services/bitcoin-readiness/... ./clients/cli/... -v -count=1 && go test ./services/telegram-notifier/... -v -count=1
          go vet ./api/... ./lib/config/... ./lib/logging/... ./lib/crypto/... ./lib/jwt/... ./services/auth-svc/... ./services/wg-manager/... ./services/billing-svc/... ./services/veritas-agent/... ./services/browser-proxy/... ./services/bitcoin-readiness/... ./clients/cli/...

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run govulncheck
        run: |
          for module in api lib/config lib/logging lib/crypto lib/jwt services/auth-svc services/wg-manager services/billing-svc services/veritas-agent services/browser-proxy clients/cli; do
            (cd "$module" && go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...)
          done

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  repository-security:
    name: Repository, manifest & policy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Trivy
        run: |
          curl -sfL --retry 5 --retry-delay 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version
        env:
          TRIVY_VERSION: ${{ env.TRIVY_VERSION }}
      - name: Scan repository
        run: |
          trivy fs --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs android/wireguard,website/downloads \
            --exit-code 1 \
            .
      - name: Validate shell scripts
        run: find deploy scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=error
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Validate Kubernetes manifests
        run: |
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.7.1
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          kustomize build deploy/k8s/overlays/k3s | kubeconform -strict -summary -ignore-missing-schemas
          kustomize build deploy/k8s/overlays/prod | kubeconform -strict -summary -ignore-missing-schemas

  build-services:
    name: Build Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-svc, wg-manager, billing-svc, veritas-agent, browser-proxy]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build ${{ matrix.service }}
        run: |
          case "${{ matrix.service }}" in
            auth-svc) go build ./services/auth-svc/cmd/server/ ;;
            wg-manager) go build ./services/wg-manager/cmd/server/ ;;
            billing-svc) go build ./services/billing-svc/cmd/server/ ;;
            veritas-agent) go build ./services/veritas-agent/cmd/agent/ ;;
            browser-proxy) go build ./services/browser-proxy/ ;;
          esac

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build CLI (${{ matrix.os }}/${{ matrix.arch }})
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p build
          go build -o build/veritas-${{ matrix.os }}-${{ matrix.arch }} ./clients/cli/cmd/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veritas-${{ matrix.os }}-${{ matrix.arch }}
          path: build/veritas-${{ matrix.os }}-${{ matrix.arch }}

  build-desktop:
    name: Build desktop web bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev pkg-config
      - run: cargo check --locked
        working-directory: clients/desktop/src-tauri
      - name: Bundle wstunnel for Stealth mode
        run: bash scripts/bundle-wstunnel-linux.sh
        working-directory: clients/desktop
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          working-directory: clients/desktop/src-tauri
          token: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Assemble and test Android app
        working-directory: android
        run: ./gradlew test assembleDebug --no-daemon

  validate-website-extension:
    name: Validate website and Chrome extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate extension manifest and bundle
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('clients/browser-extension/manifest.json')); if(m.manifest_version!==3) throw new Error('Manifest V3 required'); if(m.host_permissions.includes('<all_urls>')) throw new Error('Broad <all_urls> permission is not allowed');"
          test -f clients/browser-extension/popup.html
          test -f clients/browser-extension/js/background.js
          node --input-type=module --check < clients/browser-extension/js/background.js
          node --input-type=module --check < clients/browser-extension/js/popup.js
          node --input-type=module --check < clients/browser-extension/js/auth.js
          test -f website/downloads/veritasvpn-chrome.zip
          unzip -p website/downloads/veritasvpn-chrome.zip manifest.json > /tmp/published-manifest.json
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('/tmp/published-manifest.json')); if(m.host_permissions.includes('<all_urls>')) throw new Error('Published chrome zip must not request <all_urls>');"
          mkdir -p "$RUNNER_TEMP/veritasvpn-extension"
          cp -R clients/browser-extension/. "$RUNNER_TEMP/veritasvpn-extension/"
          (cd "$RUNNER_TEMP/veritasvpn-extension" && zip -qr "$RUNNER_TEMP/veritasvpn-extension.zip" .)
          unzip -t "$RUNNER_TEMP/veritasvpn-extension.zip" >/dev/null
      - name: Validate website entry points
        run: |
          test -f website/index.html
          test -f website/privacy.html
          test -f website/404.html
          test -f website/.well-known/security.txt
          grep -q 'Content-Security-Policy' website/_headers
          ! grep -q "unsafe-inline" website/_headers
          ! grep -RInE '<style|style="' website --include='*.html'
          ! grep -RInP '<script(?![^>]*\bsrc=)' website --include='*.html'
          ! grep -RIn 'minlength="[0-9]"' website clients/browser-extension
      - name: Validate shell scripts
        run: |
          find deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Reject mutable production image tags
        run: |
          ! grep -RInE 'newTag: latest|image: .*:latest' deploy/k8s/base deploy/k8s/overlays/prod
          find . -type f -name 'Dockerfile*' -print0 | xargs -0 awk '$1 == "FROM" && $2 !~ /@sha256:/ { print FILENAME ":" FNR ":" $0; bad=1 } END { exit bad }'

  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: auth-svc
            dockerfile: services/auth-svc/Dockerfile
            context: .
          - service: wg-manager
            dockerfile: services/wg-manager/Dockerfile
            context: .
          - service: billing-svc
            dockerfile: services/billing-svc/Dockerfile
            context: .
          - service: veritas-agent
            dockerfile: services/veritas-agent/Dockerfile
            context: .
          - service: veritas-proxy
            dockerfile: services/browser-proxy/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set registry owner (lowercase)
        run: echo "REGISTRY_OWNER=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.REGISTRY_OWNER }}/veritasvpn/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install Trivy
        run: |
          curl -sfL --retry 5 --retry-delay 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version
        env:
          TRIVY_VERSION: ${{ env.TRIVY_VERSION }}
      - name: Scan pushed image
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "ghcr.io/${{ env.REGISTRY_OWNER }}/veritasvpn/${{ matrix.service }}:${{ github.sha }}"
