name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: veritas
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        env:
          DATABASE_URL: postgres://veritas:ci-test-password@localhost:5432/veritas?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-for-ci-purposes-only
          AGENT_AUTH_TOKEN: test-agent-token
        run: go test ./lib/config/... ./lib/logging/... ./lib/crypto/... ./lib/jwt/... ./services/auth-svc/... ./services/wg-manager/... ./services/billing-svc/... ./services/veritas-agent/... -v -count=1

  build-services:
    name: Build Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-svc, wg-manager, billing-svc, veritas-agent]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build ${{ matrix.service }}
        run: |
          case "${{ matrix.service }}" in
            auth-svc) go build ./services/auth-svc/cmd/server/ ;;
            wg-manager) go build ./services/wg-manager/cmd/server/ ;;
            billing-svc) go build ./services/billing-svc/cmd/server/ ;;
            veritas-agent) go build ./services/veritas-agent/cmd/agent/ ;;
          esac

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build CLI (${{ matrix.os }}/${{ matrix.arch }})
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p build
          go build -o build/veritas-${{ matrix.os }}-${{ matrix.arch }} ./clients/cli/cmd/

      - uses: actions/upload-artifact@v4
        with:
          name: veritas-${{ matrix.os }}-${{ matrix.arch }}
          path: build/veritas-${{ matrix.os }}-${{ matrix.arch }}

  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: auth-svc
            dockerfile: services/auth-svc/Dockerfile
            context: .
          - service: wg-manager
            dockerfile: services/wg-manager/Dockerfile
            context: .
          - service: billing-svc
            dockerfile: services/billing-svc/Dockerfile
            context: .
          - service: veritas-agent
            dockerfile: services/veritas-agent/Dockerfile
            context: .
          - service: veritas-proxy
            dockerfile: containers/proxy-gateway/Dockerfile
            context: containers/proxy-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set registry owner (lowercase)
        run: echo "REGISTRY_OWNER=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.REGISTRY_OWNER }}/veritasvpn/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.REGISTRY_OWNER }}/veritasvpn/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
