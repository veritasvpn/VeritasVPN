name: Verify WAN SSH closed

on:
  workflow_dispatch:
  schedule:
    - cron: "40 5 * * *"

permissions:
  contents: read

concurrency:
  group: verify-wan-ssh
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe production public IP :22 from off-LAN GitHub runner
        env:
          # Override if the public edge IP changes.
          PUBLIC_IP: ${{ vars.VERITAS_PUBLIC_IP || '170.51.31.139' }}
        run: |
          chmod +x deploy/ops/verify-ssh-wan.sh
          # From Actions (not the LAN), success means the port is closed to the internet.
          PUBLIC_IP="$PUBLIC_IP" TIMEOUT_SEC=8 bash deploy/ops/verify-ssh-wan.sh
