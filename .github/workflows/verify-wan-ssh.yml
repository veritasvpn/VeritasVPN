name: Verify WAN SSH and metrics closed

on:
  workflow_dispatch:
  schedule:
    - cron: "40 5 * * *"

permissions:
  contents: read

concurrency:
  group: verify-wan-ssh
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve production egress IP
        id: ip
        env:
          PUBLIC_IP: ${{ vars.VERITAS_PUBLIC_IP }}
        run: |
          if [ -z "${PUBLIC_IP}" ]; then
            echo "VERITAS_PUBLIC_IP repository variable is required (Cloudflare CDN A records are not the node egress)." >&2
            echo "Set with: gh variable set VERITAS_PUBLIC_IP --repo veritasvpn/VeritasVPN --body '<egress-ip>'" >&2
            exit 1
          fi
          echo "ip=${PUBLIC_IP}" >> "$GITHUB_OUTPUT"
      - name: Probe WAN SSH closed
        run: |
          chmod +x deploy/ops/verify-ssh-wan.sh
          PUBLIC_IP="${{ steps.ip.outputs.ip }}" TIMEOUT_SEC=8 bash deploy/ops/verify-ssh-wan.sh
      - name: Probe WAN metrics ports closed
        run: |
          chmod +x deploy/ops/verify-metrics-wan.sh
          PUBLIC_IP="${{ steps.ip.outputs.ip }}" TIMEOUT_SEC=8 bash deploy/ops/verify-metrics-wan.sh
      - name: Agents nginx must 404 (no proxy_pass)
        run: |
          chmod +x deploy/ops/verify-agents-nginx-404.sh
          bash deploy/ops/verify-agents-nginx-404.sh
