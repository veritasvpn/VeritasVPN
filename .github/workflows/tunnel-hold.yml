name: Tunnel hold (5+ min)

on:
  workflow_dispatch:
  schedule:
    # Daily 04:20 UTC — complements hourly short vpn-e2e
    - cron: "20 4 * * *"

permissions:
  contents: read

concurrency:
  # Serialize with vpn-e2e / tunnel-hold so logout-all does not race the same account.
  group: veritas-e2e-account
  cancel-in-progress: false

jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install WireGuard test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wireguard-tools dnsutils jq curl
      - name: Hold tunnel 6 minutes with handshake freshness checks
        env:
          VERITAS_E2E_ACCOUNT_ID: ${{ secrets.VERITAS_E2E_ACCOUNT_ID }}
          HOLD_SECONDS: "360"
          CHECK_INTERVAL: "60"
          MAX_HANDSHAKE_AGE: "150"
          STALE_FAIL_STREAK: "2"
        run: |
          chmod +x deploy/verify/tunnel-hold-e2e.sh
          sudo --preserve-env=VERITAS_E2E_ACCOUNT_ID,HOLD_SECONDS,CHECK_INTERVAL,MAX_HANDSHAKE_AGE,STALE_FAIL_STREAK,API_BASE \
            deploy/verify/tunnel-hold-e2e.sh
