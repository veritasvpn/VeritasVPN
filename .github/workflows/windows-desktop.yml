name: Windows desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: VeritasVPN-Windows
          path: |
            clients/desktop/src-tauri/target/release/bundle/msi/*.msi
            clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            clients/desktop/src-tauri/target/release/bundle/msi/*.msi
            clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
