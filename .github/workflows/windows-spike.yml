name: Windows WireGuardNT spike

# Throwaway Phase 0 job. Delete this workflow with clients/desktop/spike/wireguard-nt
# once the Windows tunnel engine replaces it. It does not publish a release.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  wireguard-nt-spike:
    name: WireGuardNT spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Download pinned wireguard.dll
        shell: pwsh
        working-directory: clients/desktop/spike/wireguard-nt
        run: ./download.ps1

      - name: Bring a VeritasVPN adapter up and delete it
        shell: pwsh
        working-directory: clients/desktop/spike/wireguard-nt
        run: |
          $dll = (Resolve-Path "build/extracted/wireguard-nt/bin/amd64/wireguard.dll").Path
          cargo run --release --locked -- $dll
