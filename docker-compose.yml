version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veritas
      POSTGRES_USER: veritas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/auth-svc/migrations:/docker-entrypoint-initdb.d/auth:ro
      - ./services/wg-manager/migrations:/docker-entrypoint-initdb.d/wg:ro
      - ./services/billing-svc/migrations:/docker-entrypoint-initdb.d/billing:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "veritas"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Local compose only — bind via Docker network, not published ports. Do not use for production.
    command: redis-server --appendonly no --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  nats:
    image: nats:2.10-alpine
    command: -js -m 8222

  auth-svc:
    build:
      context: .
      dockerfile: services/auth-svc/Dockerfile
    environment:
      DATABASE_URL: postgres://veritas:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/veritas?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      JWT_ED25519_PRIVATE_KEY: ${JWT_ED25519_PRIVATE_KEY:?JWT_ED25519_PRIVATE_KEY must be set in .env}
      JWT_ED25519_PUBLIC_KEYS: ${JWT_ED25519_PUBLIC_KEYS:?JWT_ED25519_PUBLIC_KEYS must be set in .env}
      JWT_ACTIVE_KEY_ID: ${JWT_ACTIVE_KEY_ID:?JWT_ACTIVE_KEY_ID must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-https://api.veritasvpn.cloud}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-veritasvpn-api}
      LOG_LEVEL: info
      LOG_FORMAT: console
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://veritasvpn.cloud}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  wg-manager:
    build:
      context: .
      dockerfile: services/wg-manager/Dockerfile
    ports:
      # The host-network WireGuard agent is the only host-side caller.
      - "127.0.0.1:8082:8080"
    environment:
      DATABASE_URL: postgres://veritas:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/veritas?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      JWT_ED25519_PUBLIC_KEYS: ${JWT_ED25519_PUBLIC_KEYS:?JWT_ED25519_PUBLIC_KEYS must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-https://api.veritasvpn.cloud}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-veritasvpn-api}
      AGENT_AUTH_TOKEN: ${AGENT_AUTH_TOKEN:?AGENT_AUTH_TOKEN must be set in .env}
      LOG_LEVEL: info
      LOG_FORMAT: console
      ENVIRONMENT: production
      FREE_ALLOWED_REGIONS: ${FREE_ALLOWED_REGIONS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  veritas-agent:
    build:
      context: .
      dockerfile: services/veritas-agent/Dockerfile
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      AGENT_AUTH_TOKEN: ${AGENT_AUTH_TOKEN:?AGENT_AUTH_TOKEN must be set in .env}
      MANAGER_ENDPOINT: ${MANAGER_ENDPOINT:-http://127.0.0.1:8082}
      PUBLIC_IP: ${PUBLIC_IP:-REDACTED_IP}
      WG_INTERFACE: wg0
      WG_PORT: "51820"
      WG_PRIVATE_KEY_FILE: /etc/wireguard/private.key
      SERVER_HOSTNAME: ${SERVER_HOSTNAME:-linuxdesktop}
      SERVER_REGION: ${SERVER_REGION:-sa}
      SERVER_CITY: ${SERVER_CITY:-local}
      SERVER_COUNTRY: ${SERVER_COUNTRY:-AR}
      LOG_LEVEL: info
    volumes:
      - ./data/wireguard:/etc/wireguard
    depends_on:
      - wg-manager
    restart: unless-stopped

  billing-svc:
    build:
      context: .
      dockerfile: services/billing-svc/Dockerfile
    networks:
      - default
      - btcpay_default
    environment:
      DATABASE_URL: postgres://veritas:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/veritas?sslmode=disable
      NATS_URL: nats://nats:4222
      JWT_ED25519_PUBLIC_KEYS: ${JWT_ED25519_PUBLIC_KEYS:?JWT_ED25519_PUBLIC_KEYS must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-https://api.veritasvpn.cloud}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-veritasvpn-api}
      AGENT_AUTH_TOKEN: ${AGENT_AUTH_TOKEN:?AGENT_AUTH_TOKEN must be set in .env}
      BTCPAY_SERVER_URL: ${BTCPAY_SERVER_URL:-http://host.docker.internal:49392}
      BTCPAY_API_KEY: ${BTCPAY_API_KEY:-}
      BTCPAY_STORE_ID: ${BTCPAY_STORE_ID:-}
      BTCPAY_WEBHOOK_SECRET: ${BTCPAY_WEBHOOK_SECRET:-}
      BTCPAY_PUBLIC_URL: ${BTCPAY_PUBLIC_URL:-}
      PREMIUM_PRICE_USD_CENTS: ${PREMIUM_PRICE_USD_CENTS:-500}
      PREMIUM_PERIOD_DAYS: ${PREMIUM_PERIOD_DAYS:-30}
      CHECKOUT_SUCCESS_URL: ${CHECKOUT_SUCCESS_URL:-https://veritasvpn.cloud/account/#/subscription}
      CHECKOUT_CANCEL_URL: ${CHECKOUT_CANCEL_URL:-https://veritasvpn.cloud/account/#/subscription}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      BILLING_PUBLIC_URL: ${BILLING_PUBLIC_URL:-http://localhost:8083}
      # Opt-in only. Public hosts must leave this false/unset.
      ALLOW_MOCK_BTCPAY: ${ALLOW_MOCK_BTCPAY:-false}
      LOG_LEVEL: info
      LOG_FORMAT: console
      # Keep billing in test mode until real BTCPay credentials are provisioned.
      # Mock checkout remains disabled by ALLOW_MOCK_BTCPAY=false.
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  veritas-proxy:
    build:
      context: .
      dockerfile: services/browser-proxy/Dockerfile
    container_name: veritas-proxy
    environment:
      JWT_ED25519_PUBLIC_KEYS: ${JWT_ED25519_PUBLIC_KEYS:?JWT_ED25519_PUBLIC_KEYS must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-https://api.veritasvpn.cloud}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-veritasvpn-api}
    ports:
      - "1080:1080/tcp"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

  browser-proxy-port-mapper:
    build:
      context: ./containers/port-mapper
    container_name: browser-proxy-port-mapper
    network_mode: host
    environment:
      INTERNAL_IP: ${BROWSER_PROXY_INTERNAL_IP:?BROWSER_PROXY_INTERNAL_IP must be set}
      INTERNAL_PORT: "1080"
      EXTERNAL_PORT: ${BROWSER_PROXY_EXTERNAL_PORT:-41080}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
      - "80:80"
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./website/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        # Cloudflare Zero Trust tunnel still targets these k8s DNS names.
        # Alias them to this nginx so cloudflared on the compose network works
        # even when the Kubernetes API/cluster is down.
        aliases:
          - ingress-nginx-controller.ingress-nginx.svc.cluster.local
    depends_on:
      - billing-svc
      - wg-manager
      - auth-svc
    restart: unless-stopped

  # Fallback tunnel when the k8s cloudflared connector is down.
  # Production normally uses deploy/k8s ingress-nginx/cloudflared — do not run
  # both with the same token (Cloudflare load-balances and can hit a broken path).
  # Enable with: docker compose --profile tunnel-fallback up -d cloudflared
  cloudflared:
    profiles: ["tunnel-fallback"]
    image: cloudflare/cloudflared:2026.7.3
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - nginx

networks:
  default:
    external: true
    name: veritasvpn_default
  btcpay_default:
    external: true

volumes:
  pgdata:
