<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your VeritasVPN password</title>
<meta name="description" content="Set a new VeritasVPN password.">
<style>
@font-face{font-family:Inter;src:url("/assets/fonts/inter_400.ttf") format("truetype");font-weight:400}
@font-face{font-family:Inter;src:url("/assets/fonts/inter_600.ttf") format("truetype");font-weight:600}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#030915;color:#eaf7ff;font-family:Inter,system-ui,sans-serif}
.card{width:min(520px,100%);padding:38px;border:1px solid rgba(9,199,245,.25);border-radius:24px;background:linear-gradient(145deg,#091426,#050b17);box-shadow:0 25px 80px #0008}
.brand{text-align:center;margin-bottom:30px}.brand img{display:block;width:82px;height:auto;max-width:100%;margin:0 auto;object-fit:contain}.brand h1{font-size:25px;margin:14px 0 6px}.brand p{color:#56e7ff;margin:0;font-size:14px}
h2{margin:0 0 10px;font-size:24px} .intro{color:#a9b9cc;line-height:1.55;margin:0 0 24px}
label{display:block;color:#a9b9cc;font-size:13px;font-weight:600;margin-bottom:8px}
.password-wrap{position:relative}.password-wrap input{padding-right:52px}
input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #28415e;background:#020814;color:#fff;font-size:16px;outline:none}
input:focus{border-color:#09c7f5;box-shadow:0 0 0 3px #09c7f526}
.toggle{position:absolute;right:7px;top:7px;width:40px;height:40px;border:0;border-radius:9px;background:transparent;color:#8da5bd;font-size:20px;cursor:pointer}
.toggle:hover{color:#56e7ff;background:#10223a}
.requirements{display:grid;gap:7px;margin:14px 0 22px;color:#7188a2;font-size:13px}.requirements span{transition:color .2s}.requirements span.ok{color:#48e6b0}
button.submit{width:100%;padding:14px 18px;border:0;border-radius:12px;background:linear-gradient(105deg,#09c7f5,#0756d9);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button.submit:hover{filter:brightness(1.08)}button:disabled{opacity:.55;cursor:not-allowed;filter:none}
.message{min-height:22px;margin:16px 0 0;text-align:center;color:#ff8c9c;font-size:14px}.message.ok{color:#48e6b0}
.back{display:block;margin-top:20px;text-align:center;color:#56e7ff;text-decoration:none;font-size:14px}.back:hover{text-decoration:underline}
</style>
</head>
<body>
<main class="card">
  <header class="brand"><img src="/assets/logo-mark.png" alt="VeritasVPN"><h1>VeritasVPN</h1><p>The truth about online privacy</p></header>
  <section id="resetState">
    <h2>Choose a new password</h2>
    <p class="intro">Set a new password for your account. This reset link can only be used once.</p>
    <form id="resetForm" novalidate>
      <label for="newPassword">New password</label>
      <div class="password-wrap"><input id="newPassword" type="password" autocomplete="new-password" required minlength="10"><button type="button" class="toggle" data-target="newPassword" aria-label="Show password">&#128065;</button></div>
      <div class="requirements" aria-live="polite">
        <span id="reqLength">At least 10 characters</span>
        <span id="reqUpper">At least one uppercase letter</span>
        <span id="reqLower">At least one lowercase letter</span>
        <span id="reqNumber">At least one number</span>
      </div>
      <label for="confirmPassword">Confirm new password</label>
      <div class="password-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="10"><button type="button" class="toggle" data-target="confirmPassword" aria-label="Show password">&#128065;</button></div>
      <p id="message" class="message" role="status"></p>
      <button id="submitButton" class="submit" type="submit">Set new password</button>
    </form>
  </section>
  <a class="back" href="/">Return to VeritasVPN</a>
</main>
<script>
const API='https://api.veritasvpn.cloud';
const token=new URLSearchParams(location.search).get('token')||'';
const form=document.getElementById('resetForm');
const password=document.getElementById('newPassword');
const confirmPassword=document.getElementById('confirmPassword');
const submit=document.getElementById('submitButton');
const message=document.getElementById('message');
const checks={
  reqLength:value=>value.length>=10,
  reqUpper:value=>/[A-Z]/.test(value),
  reqLower:value=>/[a-z]/.test(value),
  reqNumber:value=>/[0-9]/.test(value)
};
function updateChecks(){
  Object.entries(checks).forEach(([id,check])=>document.getElementById(id).classList.toggle('ok',check(password.value)));
}
function show(text,ok=false){message.textContent=text;message.classList.toggle('ok',ok)}
document.querySelectorAll('.toggle').forEach(button=>button.addEventListener('click',()=>{
  const input=document.getElementById(button.dataset.target);
  const visible=input.type==='text';
  input.type=visible?'password':'text';
  button.setAttribute('aria-label',visible?'Show password':'Hide password');
}));
password.addEventListener('input',updateChecks);
if(!token){form.hidden=true;show('This reset link is missing or invalid.');}
form.addEventListener('submit',async event=>{
  event.preventDefault();
  updateChecks();
  if(!token){show('This reset link is missing or invalid.');return}
  const valid=Object.values(checks).every(check=>check(password.value));
  if(!valid){show('Use a password that meets all requirements.');return}
  if(password.value!==confirmPassword.value){show('Passwords do not match.');return}
  submit.disabled=true;submit.textContent='Updating password...';show('');
  try{
    const response=await fetch(API+'/api/v1/auth/complete-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,new_password:password.value})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||'This reset link is invalid or expired.');
    form.hidden=true;show('Your password has been updated. You can now sign in.',true);
  }catch(error){
    show(error.message||'Could not update your password.');
    submit.disabled=false;submit.textContent='Set new password';
  }
});
</script>
</body>
</html>
