<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your VeritasVPN password</title>
<meta name="description" content="Set a new VeritasVPN password.">
<link rel="stylesheet" href="/css/account-action.css">
</head>
<body>
<main class="card">
  <header class="brand"><img src="/assets/logo-mark.png" alt="VeritasVPN"><h1>VeritasVPN</h1><p>The truth about online privacy</p></header>
  <section id="resetState">
    <h2>Choose a new password</h2>
    <p class="intro">Set a new password for your account. This reset link can only be used once.</p>
    <form id="resetForm" novalidate>
      <label for="newPassword">New password</label>
      <div class="password-wrap"><input id="newPassword" type="password" autocomplete="new-password" required minlength="10"><button type="button" class="toggle" data-target="newPassword" aria-label="Show password">&#128065;</button></div>
      <div class="requirements" aria-live="polite">
        <span id="reqLength">At least 10 characters</span>
        <span id="reqUpper">At least one uppercase letter</span>
        <span id="reqLower">At least one lowercase letter</span>
        <span id="reqNumber">At least one number</span>
      </div>
      <label for="confirmPassword">Confirm new password</label>
      <div class="password-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="10"><button type="button" class="toggle" data-target="confirmPassword" aria-label="Show password">&#128065;</button></div>
      <p id="message" class="message" role="status"></p>
      <button id="submitButton" class="submit" type="submit">Set new password</button>
    </form>
  </section>
  <a class="back" href="/">Return to VeritasVPN</a>
</main>
<script src="/js/reset-password.js" defer></script>
</body>
</html>
