<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify email · VeritasVPN</title><link rel="icon" href="/assets/favicon.png">
<style>@font-face{font-family:"Inter";font-style:normal;font-weight:400;src:url("/assets/fonts/inter_400.ttf") format("truetype")}@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:700;src:url("/assets/fonts/space_grotesk_700.ttf") format("truetype")}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#030915;color:#eaf7ff;font-family:Inter,system-ui,sans-serif}.card{width:min(520px,calc(100% - 48px));padding:42px;border:1px solid rgba(9,199,245,.25);border-radius:24px;background:linear-gradient(145deg,#091426,#050b17);box-shadow:0 25px 80px #0008;text-align:center}.logo{width:78px}.status{font-family:"Space Grotesk",sans-serif;color:#09c7f5;font-size:30px;margin:22px 0 12px}.message{color:#a9b9cc;line-height:1.6}.actions{display:grid;gap:12px;margin-top:25px}button,a{border:0;border-radius:12px;padding:14px 18px;font-weight:750;font-size:15px}button{background:linear-gradient(105deg,#09c7f5,#0756d9);color:white;cursor:pointer}a{color:#09c7f5;text-decoration:none;border:1px solid #09c7f555}input{padding:14px;border-radius:12px;border:1px solid #28415e;background:#020814;color:white;font-size:15px}#resend{display:none}</style></head>
<body><main class="card"><img class="logo" src="/assets/logo-mark.png" alt="VeritasVPN"><h1 id="status" class="status">Verifying your email…</h1><p id="message" class="message">Please keep this page open for a moment.</p><div id="resend" class="actions"><input id="email" type="email" autocomplete="email" placeholder="Email address"><button id="resendButton">Send a new verification link</button></div><div class="actions"><a href="/">Return to VeritasVPN</a></div></main>
<script>const API='https://api.veritasvpn.cloud';const statusEl=document.getElementById('status'),messageEl=document.getElementById('message'),resend=document.getElementById('resend');async function verify(){const token=new URLSearchParams(location.search).get('token');if(!token){failed();return}try{const response=await fetch(API+'/api/v1/auth/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});if(!response.ok)throw new Error();statusEl.textContent='Email verified';messageEl.textContent='Your account is active. You can now sign in from the website or any VeritasVPN app.'}catch{failed()}}function failed(){statusEl.textContent='This link is invalid or expired';messageEl.textContent='Enter your email below and we will send a fresh single-use verification link.';resend.style.display='grid'}document.getElementById('resendButton').addEventListener('click',async()=>{const email=document.getElementById('email').value.trim();if(!email)return;const button=document.getElementById('resendButton');button.disabled=true;await fetch(API+'/api/v1/auth/resend-verification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}).catch(()=>{});messageEl.textContent='If this account is awaiting verification, a new link has been sent.';button.disabled=false});verify();</script></body></html>
