map $http_origin $cors_origin {
    default "";
    "https://veritasvpn.cloud"    "$http_origin";
    "https://www.veritasvpn.cloud" "$http_origin";
    "http://localhost:8000"        "$http_origin";
    "http://127.0.0.1:8000"        "$http_origin";
    "tauri://localhost"            "$http_origin";
    "http://tauri.localhost"       "$http_origin";
    "https://tauri.localhost"      "$http_origin";
}

server {
    listen 8000;
    listen 80;
    server_name veritasvpn.cloud api.veritasvpn.cloud localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Tunnel terminates TLS at the edge and connects to this origin
    # over HTTP without always setting X-Forwarded-Proto. Do not force a
    # https:// redirect here — it causes a redirect loop for veritasvpn.cloud.
    # Clients always reach the public site via https:// through Cloudflare.

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Vary "Origin" always;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

    # Desktop WebViews must complete CORS preflight before auth middleware runs.
    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Short TTL so Cloudflare/browsers pick up CSS/JS deploys (also bust ?v=).
    location ~* \.(css|js)$ {
        expires 5m;
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    location = / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /api/v1/auth/ {
        proxy_pass http://auth-svc:8080/api/v1/auth/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /api/v1/billing/ {
        proxy_pass http://billing-svc:8080/api/v1/billing/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /api/v1/wg/ {
        proxy_pass http://wg-manager:8080/api/v1/wg/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /api/v1/agents/ {
        proxy_pass http://wg-manager:8080/api/v1/agents/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
