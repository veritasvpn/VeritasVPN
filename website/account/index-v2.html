<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — VeritasVPN</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/style-typography1.css">
  <link rel="stylesheet" href="/account/css/account.css">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
</head>
<body class="account-app">
  <div class="account-shell" id="accountShell" hidden>
    <aside class="account-sidebar">
      <a href="/" class="account-brand">
        <img src="/assets/logo-mark.png" alt="" width="32" height="32">
        <span>Veritas<span class="logo-highlight">VPN</span></span>
      </a>
      <nav class="account-nav" aria-label="Account">
        <a href="#/" class="account-nav-link is-active" data-route="/">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V21a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1v-10.5z"/></svg>
          Home
        </a>
        <a href="#/subscription" class="account-nav-link" data-route="/subscription">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
          Subscription
        </a>
        <a href="#/downloads" class="account-nav-link" data-route="/downloads">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          Downloads
        </a>
        <a href="#/account" class="account-nav-link" data-route="/account">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
          Account
        </a>
        <a href="#/security" class="account-nav-link" data-route="/security">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V7l8-4z"/></svg>
          Security
        </a>
      </nav>
      <button type="button" class="account-signout" id="accountSignOut">Sign out</button>
    </aside>

    <div class="account-main">
      <header class="account-topbar">
        <button type="button" class="account-mobile-nav" id="accountMobileNav" aria-label="Menu">☰</button>
        <div class="account-topbar-actions">
          <button type="button" class="btn btn-outline btn-sm" id="headerUpgradeBtn">Upgrade</button>
          <div class="account-user-chip">
            <span class="nav-user-avatar" aria-hidden="true"></span>
            <span id="accountEmail"></span>
          </div>
        </div>
      </header>

      <main class="account-content" id="accountContent">
        <p class="account-loading">Loading your account…</p>
      </main>
    </div>
  </div>

  <div class="account-boot" id="accountBoot">
    <img src="/assets/logo-mark.png" alt="" width="48" height="48">
    <p>Checking session…</p>
  </div>

  <script type="module" src="/js-v2/account-app.js"></script>
</body>
</html>
