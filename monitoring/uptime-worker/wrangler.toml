name = "veritas-uptime"
main = "src/index.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "UPTIME_STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

