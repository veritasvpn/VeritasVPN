# fwupd device ids left out of veritas_host_firmware_updates_pending.
#
# One entry per line:
#   <device-id> [<offered-version>]
#   bios_minimum <dotted-version>
#
# A device id alone ignores every offered release. With an offered version,
# only that release is ignored; a newer release still counts as pending.
# Blank lines and anything after # are ignored.
#
# Install (the script reads the /etc copy, not this repo path):
#   sudo install -m 0755 deploy/systemd/veritas-hardware-health.sh /usr/local/sbin/veritas-hardware-health
#   sudo install -d -m 0755 /etc/veritasvpn
#   sudo install -m 0644 deploy/systemd/firmware-ignore.conf /etc/veritasvpn/firmware-ignore.conf
#   sudo systemctl start veritas-hardware-health.service
#
# UEFI dbx offered 20260707 (installed 20230501) fails on every reboot on this
# OptiPlex 3060 running BIOS 1.26.0. fwupd reports
# "expected 20260707 and got 20230501". The firmware rejects updates queued
# from Linux, so the pending alert would never clear. Deferred until a BIOS
# 1.32.0 flash by hand.
362301da643102b9f38477387e2193e57abaa590 20260707

# Some BIOS releases are published only on Dell's site and never appear in
# fwupd. Raise DellBiosBelowMinimum while the installed version is older.
bios_minimum 1.32.0
