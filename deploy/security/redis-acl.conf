# Redis ACL configuration for VeritasVPN production
# Applied via: redis-server --aclfile /etc/redis/acl.conf
#
# Default user — no password, local access only in docker network
user default off

# Application user — full access within Docker network
user veritas on >${REDIS_PASSWORD} ~* &* +@all

# Read-only user for monitoring
user monitor on >${REDIS_MONITOR_PASSWORD:-} +ping +info +client|list +slowlog|get +slowlog|len +command|info ~*

# Disallow dangerous/flush commands for application user is implied by above
