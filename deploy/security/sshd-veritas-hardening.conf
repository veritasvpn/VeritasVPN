# VeritasVPN host SSH hardening — install via deploy/security/install-ssh-hardening.sh
# Must live in sshd_config.d as 00-veritas-hardening.conf (before 50-cloud-init.conf).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
MaxAuthTries 3
X11Forwarding no
