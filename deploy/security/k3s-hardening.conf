[Service]
# The original installer unit contained --write-kubeconfig-mode 644, which
# takes precedence over config.yaml. Replace only ExecStart and retain the
# server's existing disable/max-pods arguments. Kubernetes API-server audit
# arguments must be passed through K3s with --kube-apiserver-arg.
ExecStart=
ExecStart=/usr/local/bin/k3s server --write-kubeconfig-mode 600 --disable servicelb --disable traefik --kubelet-arg=max-pods=250 --kube-apiserver-arg=audit-policy-file=/var/lib/rancher/k3s/server/audit.yaml --kube-apiserver-arg=audit-log-path=/var/lib/rancher/k3s/server/logs/audit.log --kube-apiserver-arg=audit-log-maxage=30 --kube-apiserver-arg=audit-log-maxbackup=10 --kube-apiserver-arg=audit-log-maxsize=100
