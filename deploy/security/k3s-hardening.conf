[Service]
# The original installer unit contained --write-kubeconfig-mode 644, which
# takes precedence over config.yaml. Replace only ExecStart and retain the
# server's existing disable/max-pods arguments.
ExecStart=
ExecStart=/usr/local/bin/k3s server --write-kubeconfig-mode 600 --disable servicelb --disable traefik --kubelet-arg=max-pods=250

