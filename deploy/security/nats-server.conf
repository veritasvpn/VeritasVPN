# NATS server configuration
# Mount at /etc/nats/nats-server.conf in the container

# Client port (internal Docker network only)
port: 4222

# HTTP monitoring
http_port: 8222
http_base_path: /

# JetStream
jetstream {
  store_dir: "/data"
  max_memory_store: 64MB
  max_file_store: 256MB
}

# Default limits
limits {
  max_connections: 100
  max_payload: 1MB
  max_subscriptions: 1000
}

# Enable TLS for client connections (optional, inside Docker network)
# tls {
#   cert_file: "/etc/nats/certs/server.crt"
#   key_file: "/etc/nats/certs/server.key"
# }

# Authorization
authorization {
  # Operator user with full access
  user: $NATS_USER
  password: $NATS_PASSWORD

  # App-level permissions
  permissions: {
    publish: {
      allow: [
        "auth.>",
        "billing.>",
        "wg.>",
        "agent.>",
        "entitlements.>",
        "$JS.API.>"
      ]
    }
    subscribe: {
      allow: [
        "auth.>",
        "billing.>",
        "wg.>",
        "agent.>",
        "entitlements.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
  }
}
