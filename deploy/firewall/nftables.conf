#!/usr/sbin/nft -f
# Reference template for the agent-owned table. Runtime rules are rendered by
# services/veritas-agent/internal/firewall. Host input policy lives in
# deploy/node/veritas-firewall.sh (table inet veritas_filter).

flush table inet veritas

table inet veritas {
  chain nat {
    type nat hook postrouting priority srcnat; policy accept;
    iifname "wg0" oifname "enp1s0" masquerade
  }

  chain forward {
    type filter hook forward priority filter; policy drop;

    # Kubernetes CNI (never from the VPN iface).
    iifname != "wg0" ip saddr 10.42.0.0/24 accept
    iifname != "wg0" ip daddr 10.42.0.0/24 accept
    iifname != "wg0" ip saddr 10.43.0.0/16 accept
    iifname != "wg0" ip daddr 10.43.0.0/16 accept
    iifname "cni0" accept
    oifname "cni0" accept
    iifname "flannel.1" accept
    oifname "flannel.1" accept

    ct state established,related accept

    # No client-to-client / private lateral movement.
    iifname "wg0" oifname "wg0" counter drop
    iifname "wg0" ip daddr 10.0.0.0/24 counter drop
    iifname "wg0" ip daddr 10.0.0.0/8 counter drop
    iifname "wg0" ip daddr 172.16.0.0/12 counter drop
    iifname "wg0" ip daddr 192.168.0.0/16 counter drop
    iifname "wg0" ip daddr 169.254.0.0/16 counter drop
    iifname "wg0" ip daddr 127.0.0.0/8 counter drop
    iifname "wg0" ip daddr 100.64.0.0/10 counter drop

    # MSS clamp + internet egress only.
    iifname "wg0" oifname "enp1s0" tcp flags syn tcp option maxseg size set 1380
    oifname "wg0" tcp flags syn tcp option maxseg size set 1380
    iifname "wg0" oifname "enp1s0" accept
    iifname "enp1s0" oifname "wg0" ct state established,related accept
  }

  chain input {
    type filter hook input priority filter; policy accept;
    ct state established,related accept
    iifname "wg0" ip daddr 10.0.0.1 udp dport 53 accept
    iifname "wg0" ip daddr 10.0.0.1 tcp dport 53 accept
    iifname "wg0" ip protocol icmp accept
    udp dport 51820 accept
    iifname "wg0" counter drop
  }
}
