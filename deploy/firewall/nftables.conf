#!/usr/sbin/nft -f

flush ruleset

table inet veritas {

  chain input {
    type filter hook input priority filter; policy drop;

    # Allow loopback
    iif lo accept

    # Allow established/related
    ct state established,related accept

    # WireGuard
    udp dport 51820 accept

    # Tailscale SSH
    iifname tailscale0 tcp dport 22 accept

    # Optional LAN management SSH (uncomment and adjust)
    # ip saddr 192.168.1.0/24 tcp dport 22 accept

    # ICMP (safe types only)
    ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded } accept
    ip6 nexthdr ipv6-icmp accept

    # Reject with icmp to avoid silent timeouts
    reject with icmpx type admin-prohibited
  }

  chain forward {
    type filter hook forward priority filter; policy drop;

    # MSS clamping for WireGuard tunnels
    # WG overhead (IPv4): 20 IP + 8 UDP + 32 WG = 60 bytes. wg0 MTU 1420 → MSS 1380.
    tcp flags syn tcp option maxseg size set 1380

    # Allow WireGuard → internet
    iifname wg0 oifname eth0 ct state new,established,related accept

    # Allow return traffic
    iifname eth0 oifname wg0 ct state established,related accept
  }

  chain nat_postrouting {
    type nat hook postrouting priority srcnat; policy accept;

    # MASQUERADE WireGuard clients through egress interface
    iifname wg0 oifname eth0 masquerade
  }

}
