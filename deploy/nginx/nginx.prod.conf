map $http_origin $cors_origin {
    default "";
    "https://veritasvpn.cloud"      "$http_origin";
    "https://www.veritasvpn.cloud"   "$http_origin";
    "https://api.veritasvpn.cloud"   "$http_origin";
}

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=billing_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=provisioning_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=60r/s;

server {
    listen 8000;
    listen 80;
    server_name veritasvpn.cloud localhost;

    # Global limits
    limit_req zone=global_limit burst=100 nodelay;
    limit_conn conn_limit 20;

    # Request limits
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Block direct IP access
    if ($host !~ ^(veritasvpn\.cloud|www\.veritasvpn\.cloud|api\.veritasvpn\.cloud|localhost)$) {
        return 444;
    }

    # Health check (public, unauthenticated)
    location /healthz {
        access_log off;
        return 200 "ok";
    }

    # Auth endpoints — strict rate limit
    location /api/v1/auth/ {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Veritas-Client";
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://auth-svc:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Billing endpoints
    location /api/v1/billing/ {
        add_header Access-Control-Allow-Origin $cors_origin always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        limit_req zone=billing_limit burst=5 nodelay;
        proxy_pass http://billing-svc:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # WireGuard manager — SSE streaming
    location /api/v1/wg/ {
        add_header Access-Control-Allow-Origin $cors_origin always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        proxy_pass http://wg-manager:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Agents reach wg-manager on cluster DNS, not the public edge.
    location /api/v1/agents/ {
        return 404;
    }

    # Static website (no auth required)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ $uri.html =404;

        location ~* \.(css|js|svg|png|jpg|webp|woff2)$ {
            expires 5m;
            add_header Cache-Control "public, max-age=300";
        }

        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
