# VeritasVPN deliberately runs IPv4-only until an end-to-end IPv6 tunnel is
# implemented. This prevents clients from bypassing the tunnel over IPv6.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1

# Routing / anti-spoofing
net.ipv4.ip_forward = 1
net.ipv4.conf.all.forwarding = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_syncookies = 1

# Keep IPv6 disabled even if a namespace re-enables it later.
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Non-root stealth listener. veritas-wstunnel runs as uid 65532 with
# CAP_NET_BIND_SERVICE, hostNetwork, on STEALTH_ENDPOINT_PORT=443.
# That capability does not override the unprivileged-port floor: with the
# default net.ipv4.ip_unprivileged_port_start=1024 the bind fails with
# EACCES ("Permission denied (os error 13)"). Setting the floor to 443 makes
# that port unprivileged and leaves ports 1–442 privileged. Do not run the
# DaemonSet as root to work around this.
net.ipv4.ip_unprivileged_port_start = 443
