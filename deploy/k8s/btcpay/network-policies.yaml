apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: btcpay-default-deny-ingress
  namespace: btcpay
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: btcpay-allow-internal
  namespace: btcpay
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [bitcoind, nbxplorer, btcpayserver, postgres-btcpay]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { port: 8332, protocol: TCP }
        - { port: 8333, protocol: TCP }
        - { port: 32838, protocol: TCP }
        - { port: 49392, protocol: TCP }
        - { port: 5432, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: btcpay-allow-billing
  namespace: btcpay
spec:
  podSelector:
    matchLabels:
      app: btcpayserver
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: veritas
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { port: 49392, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: btcpay-allow-monitoring
  namespace: btcpay
spec:
  podSelector:
    matchLabels:
      app: postgres-btcpay
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { port: 5432, protocol: TCP }

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: btcpay-allow-readiness
  namespace: btcpay
spec:
  podSelector:
    matchLabels:
      app: bitcoin-readiness
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: veritas
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { port: 8080, protocol: TCP }
---
# Testnet payment workloads do not need unrestricted outbound access. Keep DNS,
# Bitcoin P2P, their explicit internal dependencies, and BTCPay rate lookups.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: btcpay-bitcoind-egress
  namespace: btcpay
spec:
  podSelector:
    matchLabels: { app: bitcoind }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: 8333, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: btcpay-nbxplorer-egress
  namespace: btcpay
spec:
  podSelector:
    matchLabels: { app: nbxplorer }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels: { app: bitcoind }
      ports:
        - { port: 8332, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: btcpay-server-egress
  namespace: btcpay
spec:
  podSelector:
    matchLabels: { app: btcpayserver }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels: { app: nbxplorer }
      ports:
        - { port: 32838, protocol: TCP }
    - to:
        - podSelector:
            matchLabels: { app: postgres-btcpay }
      ports:
        - { port: 5432, protocol: TCP }
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: 443, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: btcpay-readiness-egress
  namespace: btcpay
spec:
  podSelector:
    matchLabels: { app: bitcoin-readiness }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels: { app: bitcoind }
      ports:
        - { port: 8332, protocol: TCP }
