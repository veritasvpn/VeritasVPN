apiVersion: v1
kind: Secret
metadata:
  name: btcpay-secrets
  namespace: btcpay
type: Opaque
stringData:
  BTCPAY_POSTGRES_PASSWORD: CHANGE_ME
  BTC_RPC_PASSWORD: CHANGE_ME
  BTC_RPC_USER: CHANGE_ME
# Copy this file to secrets.yaml and replace values before deploying.
# secrets.yaml is in .gitignore — never commit real credentials.
