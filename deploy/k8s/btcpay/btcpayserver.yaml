apiVersion: v1
kind: Service
metadata:
  name: btcpayserver
  namespace: btcpay
  labels:
    app: btcpayserver
spec:
  type: ClusterIP
  ports:
    - port: 49392
      targetPort: 49392
  selector:
    app: btcpayserver
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: btcpayserver
  namespace: btcpay
  labels:
    app: btcpayserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: btcpayserver
  template:
    metadata:
      labels:
        app: btcpayserver
    spec:
      containers:
        - name: btcpayserver
          image: btcpayserver/btcpayserver:2.3.9
          env:
            - name: BTCPAY_NETWORK
              value: "mainnet"
            - name: BTCPAY_CHAINS
              value: "btc"
            - name: BTCPAY_BIND
              value: "0.0.0.0:49392"
            - name: BTCPAY_EXTERNALURL
              value: "https://btcpay.veritasvpn.cloud"
            - name: BTCPAY_BTCEXPLORERURL
              value: "http://nbxplorer:32838"
            - name: BTCPAY_CHECKREVOCATIONLIST
              value: "false"
          command:
            - /bin/sh
            - -c
            - |
              eval "export BTCPAY_POSTGRES=\"User ID=btcpay;Password=$BTCPAY_POSTGRES_PASSWORD;Host=postgres-btcpay;Port=5432;Database=btcpay\""
              exec /app/docker-entrypoint.sh
          envFrom:
            - secretRef:
                name: btcpay-secrets
          ports:
            - containerPort: 49392
          readinessProbe:
            httpGet:
              path: /
              port: 49392
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 49392
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
