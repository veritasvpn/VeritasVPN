apiVersion: v1
kind: Service
metadata:
  name: bitcoind
  namespace: btcpay
  labels:
    app: bitcoind
spec:
  type: ClusterIP
  ports:
    - name: rpc
      port: 8332
      targetPort: 8332
    - name: p2p
      port: 8333
      targetPort: 8333
  selector:
    app: bitcoind
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bitcoind
  namespace: btcpay
  labels:
    app: bitcoind
spec:
  serviceName: bitcoind
  replicas: 1
  selector:
    matchLabels:
      app: bitcoind
  template:
    metadata:
      labels:
        app: bitcoind
    spec:
      containers:
        - name: bitcoind
          image: btcpayserver/bitcoin@sha256:0c34551ebc67c569026592b94a152a1d1955f0014975ab0d35edd0d1b2ca567e
          env:
            - name: BITCOIN_NETWORK
              value: "mainnet"
            - name: BTC_RPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: btcpay-secrets
                  key: BTC_RPC_PASSWORD
            - name: BTC_RPC_USER
              value: "btcpay_rpc"
          command:
            - /bin/sh
            - -c
            - |
              exec bitcoind \
                -datadir=/home/bitcoin/.bitcoin \
                -testnet=0 \
                -prune=10000 \
                -dbcache=1024 \
                -rpcuser="${BTC_RPC_USER}" \
                -rpcpassword="${BTC_RPC_PASSWORD}" \
                -rpcallowip=10.42.0.0/16 \
                -rpcbind=0.0.0.0 \
                -rpcport=8332 \
                -whitelist=10.42.0.0/16 \
                -port=8333 \
                -txindex=0 \
                -server=1
          ports:
            - containerPort: 8332
              name: rpc
            - containerPort: 8333
              name: p2p
          volumeMounts:
            - name: bitcoind-data
              mountPath: /home/bitcoin/.bitcoin
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - bitcoin-cli -rpcuser=$BTC_RPC_USER -rpcpassword=$BTC_RPC_PASSWORD getblockcount 2>/dev/null | grep -Eq "^[0-9]+$"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 10
          livenessProbe:
            # Do not restart Bitcoin Core merely because RPC is slow during sync.
            # A crashed process exits and is still detected by this probe.
            exec:
              command:
                - /bin/sh
                - -c
                - kill -0 1
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - bitcoin-cli -rpcuser=$BTC_RPC_USER -rpcpassword=$BTC_RPC_PASSWORD getblockcount >/dev/null 2>&1
            periodSeconds: 20
            timeoutSeconds: 30
            failureThreshold: 180
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
  volumeClaimTemplates:
    - metadata:
        name: bitcoind-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 30Gi
