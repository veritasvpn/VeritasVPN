apiVersion: v1
kind: Service
metadata:
  name: btcpayserver-mainnet
  namespace: btcpay-mainnet
  labels:
    app: btcpayserver-mainnet
spec:
  type: ClusterIP
  ports:
    - port: 49392
      targetPort: 49392
  selector:
    app: btcpayserver-mainnet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: btcpayserver-mainnet
  namespace: btcpay-mainnet
  labels:
    app: btcpayserver-mainnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: btcpayserver-mainnet
  template:
    metadata:
      labels:
        app: btcpayserver-mainnet
    spec:
      containers:
        - name: btcpayserver-mainnet
          image: btcpayserver/btcpayserver@sha256:7c4b79fd578d919da1bc3bb52fd4695c156fe309ab8c0b6602c36026f1780d27
          env:
            - name: BTCPAY_NETWORK
              value: "mainnet"
            - name: BTCPAY_CHAINS
              value: "btc"
            - name: BTCPAY_BIND
              value: "0.0.0.0:49392"
            - name: BTCPAY_EXTERNALURL
              value: "https://btcpay-mainnet.veritasvpn.cloud"
            - name: BTCPAY_BTCEXPLORERURL
              value: "http://nbxplorer-mainnet:32838"
            - name: BTCPAY_CHECKREVOCATIONLIST
              value: "false"
          command:
            - /bin/sh
            - -c
            - |
              eval "export BTCPAY_POSTGRES=\"User ID=btcpay;Password=$BTCPAY_POSTGRES_PASSWORD;Host=postgres-btcpay-mainnet;Port=5432;Database=btcpay\""
              exec /app/docker-entrypoint.sh
          envFrom:
            - secretRef:
                name: btcpay-mainnet-secrets
          ports:
            - containerPort: 49392
          readinessProbe:
            httpGet:
              path: /
              port: 49392
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            # Keep BTCPay alive while NBXplorer catches up with Bitcoin.
            tcpSocket:
              port: 49392
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
