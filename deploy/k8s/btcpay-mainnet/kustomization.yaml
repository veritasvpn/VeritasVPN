apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: btcpay-mainnet

resources:
  - namespace.yaml
  - secrets.yaml
  - postgres-btcpay.yaml
  - bitcoind.yaml
  - bitcoin-readiness.yaml
  - nbxplorer.yaml
  - btcpayserver.yaml
  - network-policies.yaml

images:
  - name: localhost:31500/bitcoin-readiness
    newName: localhost:31500/bitcoin-readiness
    # Match the already-running testnet readiness image, which is present in
    # the Dell's local immutable registry cache.
    digest: sha256:9a67ab674a82a45e13af76c538d5bda6ee1fd314c557462ab3b3455a84804fb9
