apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: btcpay-mainnet

resources:
  - namespace.yaml
  # secrets.yaml is intentionally NOT applied by kustomize — production
  # btcpay-secrets is cluster-managed. Applying an incomplete secrets.yaml
  # can wipe live BTCPay keys. Create/update with kubectl create secret /
  # kubectl patch only (see deploy/k8s/SECRETS.md).
  - postgres-btcpay.yaml
  - bitcoind.yaml
  - bitcoin-readiness.yaml
  - nbxplorer.yaml
  - btcpayserver.yaml
  - network-policies.yaml

images:
  - name: localhost:31500/bitcoin-readiness
    newName: localhost:31500/bitcoin-readiness
    digest: sha256:f3a7a96b3d5e48bcde396602a8f72ffb9314c4d0a6900ef88a10a5789444e001
