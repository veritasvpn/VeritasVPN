apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: btcpay-default-deny-ingress
  namespace: btcpay-mainnet
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: btcpay-allow-internal
  namespace: btcpay-mainnet
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [bitcoind-mainnet, nbxplorer-mainnet, btcpayserver-mainnet, postgres-btcpay-mainnet]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { port: 8332, protocol: TCP }
        - { port: 8333, protocol: TCP }
        - { port: 32838, protocol: TCP }
        - { port: 49392, protocol: TCP }
        - { port: 5432, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: btcpay-allow-billing
  namespace: btcpay-mainnet
spec:
  podSelector:
    matchLabels:
      app: btcpayserver-mainnet
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: veritas
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { port: 49392, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: btcpay-allow-monitoring
  namespace: btcpay-mainnet
spec:
  podSelector:
    matchLabels:
      app: postgres-btcpay-mainnet
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { port: 5432, protocol: TCP }
