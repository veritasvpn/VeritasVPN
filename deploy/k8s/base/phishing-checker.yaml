apiVersion: v1
kind: Service
metadata:
  name: phishing-checker
  namespace: veritas
  labels:
    app: phishing-checker
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: phishing-checker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phishing-checker
  namespace: veritas
  labels:
    app: phishing-checker
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: phishing-checker
  template:
    metadata:
      labels:
        app: phishing-checker
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: phishing-checker
          image: localhost:31500/phishing-checker@sha256:cc44aade31f2545a4bd4c951e63e557488c5e5e3a3f7c94db397437afbdec76e
          imagePullPolicy: IfNotPresent
          env:
            - name: RATE_LIMIT_PER_MINUTE
              value: "10"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
