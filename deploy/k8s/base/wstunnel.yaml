apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: veritas-wstunnel
  namespace: veritas
  labels:
    app: veritas-wstunnel
spec:
  # This pod exclusively owns host TCP 443, so a surge rollout cannot run two
  # copies. The transactional deploy script performs the guarded replacement.
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: veritas-wstunnel
  template:
    metadata:
      labels:
        app: veritas-wstunnel
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        veritas-vpn-node: "true"
      tolerations:
        - operator: Exists
      containers:
        - name: wstunnel
          image: localhost:31500/wstunnel@sha256:4169260f4a2dc84df3c97aeba46882d5f7ee1b6ef94427b6c7f86951fc3b89b1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              exec /usr/local/bin/wstunnel server \
                --restrict-http-upgrade-path-prefix "$STEALTH_PATH_PREFIX" \
                --restrict-to 127.0.0.1:51820 \
                "wss://0.0.0.0:${STEALTH_LISTEN_PORT}"
          env:
            - name: STEALTH_PATH_PREFIX
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: STEALTH_PATH_PREFIX
            - name: STEALTH_LISTEN_PORT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: STEALTH_ENDPOINT_PORT
          ports:
            - name: stealth
              containerPort: 443
              hostPort: 443
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
