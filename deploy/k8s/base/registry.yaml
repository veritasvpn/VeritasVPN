apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-pvc
  namespace: veritas
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: veritas
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: registry
---
# The registry is published on the node at 127.0.0.1:31500 via a loopback
# hostPort. Workload images are pinned to localhost:31500/<image>@sha256:…, so
# containerd must be able to resolve that address on its own: a manual
# `kubectl port-forward` does not survive a reboot, and without it every
# imagePullPolicy: Always workload lands in ImagePullBackOff until an operator
# intervenes.
#
# hostIP pins the bind to loopback, so this is reachable only from the node
# itself. That is deliberately not a NodePort, which would publish an
# unauthenticated registry on every interface.
#
# Host pushes: docker tag … localhost:31500/<image>:<tag> && docker push …
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: veritas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: volume-permissions
          image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          command: ["sh", "-c", "chown -R 65532:65532 /var/lib/registry"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      containers:
        - name: registry
          image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          ports:
            - containerPort: 5000
              hostPort: 31500
              hostIP: 127.0.0.1
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-pvc
