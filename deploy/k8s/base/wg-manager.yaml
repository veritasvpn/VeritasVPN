apiVersion: v1
kind: Service
metadata:
  name: wg-manager
  namespace: veritas
  labels:
    app: wg-manager
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: wg-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-manager
  namespace: veritas
  labels:
    app: wg-manager
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: wg-manager
  template:
    metadata:
      labels:
        app: wg-manager
    spec:
      containers:
        - name: wg-manager
          image: localhost:31500/wg-manager@sha256:ec33cc94485723b36eed42318a86650dbd4d28a04bd366fb2e73d49f0ff55e61
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "postgres://veritas:$(DB_PASSWORD)@postgres:5432/veritas?sslmode=prefer"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: NATS_URL
              value: "nats://$(NATS_USER):$(NATS_PASSWORD)@nats:4222"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: REDIS_PASSWORD
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: NATS_USER
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: NATS_PASSWORD
            - name: JWT_ED25519_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: JWT_ED25519_PUBLIC_KEYS
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: JWT_AUDIENCE
            - name: AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: AGENT_AUTH_TOKEN
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: LOG_LEVEL
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: LOG_FORMAT
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: ENVIRONMENT
            - name: FREE_ALLOWED_REGIONS
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: FREE_ALLOWED_REGIONS
            - name: LAN_ENDPOINT_IP
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: LAN_ENDPOINT_IP
            - name: LAN_ENDPOINT_PORT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: LAN_ENDPOINT_PORT
            - name: PUBLIC_IP
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: PUBLIC_IP
            - name: STEALTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: STEALTH_ENABLED
            - name: STEALTH_ENDPOINT_HOST
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: STEALTH_ENDPOINT_HOST
            - name: STEALTH_ENDPOINT_PORT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: STEALTH_ENDPOINT_PORT
            - name: STEALTH_PATH_PREFIX
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: STEALTH_PATH_PREFIX
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
