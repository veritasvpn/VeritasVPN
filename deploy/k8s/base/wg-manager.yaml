apiVersion: v1
kind: Service
metadata:
  name: wg-manager
  namespace: veritas
  labels:
    app: wg-manager
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: wg-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-manager
  namespace: veritas
  labels:
    app: wg-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wg-manager
  template:
    metadata:
      labels:
        app: wg-manager
    spec:
      containers:
        - name: wg-manager
          image: localhost:31500/wg-manager:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "postgres://veritas:$(DB_PASSWORD)@postgres:5432/veritas?sslmode=disable"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: JWT_SECRET
            - name: AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: AGENT_AUTH_TOKEN
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: LOG_LEVEL
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: LOG_FORMAT
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: ENVIRONMENT
            - name: FREE_ALLOWED_REGIONS
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: FREE_ALLOWED_REGIONS
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
