apiVersion: v1
kind: Service
metadata:
  name: billing-svc
  namespace: veritas
  labels:
    app: billing-svc
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: billing-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-svc
  namespace: veritas
  labels:
    app: billing-svc
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: billing-svc
  template:
    metadata:
      labels:
        app: billing-svc
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: billing-svc
          image: localhost:31500/billing-svc@sha256:7070156a283c095bdef20dd2342a17586eec7eb8ec66f2d70164abaeda02f57f
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "postgres://veritas:$(DB_PASSWORD)@postgres:5432/veritas?sslmode=prefer"
            - name: NATS_URL
              value: "nats://$(NATS_USER):$(NATS_PASSWORD)@nats:4222"
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: NATS_USER
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: NATS_PASSWORD
            - name: JWT_ED25519_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: JWT_ED25519_PUBLIC_KEYS
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: JWT_AUDIENCE
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: REDIS_PASSWORD
            - name: AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: AGENT_AUTH_TOKEN
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: LOG_LEVEL
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: LOG_FORMAT
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: ENVIRONMENT
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: CORS_ORIGINS
            - name: BITCOIN_READINESS_URL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: BITCOIN_READINESS_URL
            - name: BTCPAY_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: BTCPAY_SERVER_URL
            - name: BTCPAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: BTCPAY_API_KEY
            - name: BTCPAY_STORE_ID
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: BTCPAY_STORE_ID
            - name: BTCPAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: BTCPAY_WEBHOOK_SECRET
            - name: BTCPAY_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: BTCPAY_PUBLIC_URL
            - name: PREMIUM_PRICE_USD_CENTS
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: PREMIUM_PRICE_USD_CENTS
            - name: PREMIUM_PERIOD_DAYS
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: PREMIUM_PERIOD_DAYS
            - name: CHECKOUT_SUCCESS_URL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: CHECKOUT_SUCCESS_URL
            - name: CHECKOUT_CANCEL_URL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: CHECKOUT_CANCEL_URL
            - name: BILLING_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: BILLING_PUBLIC_URL
            - name: ALLOW_MOCK_BTCPAY
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: ALLOW_MOCK_BTCPAY
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
