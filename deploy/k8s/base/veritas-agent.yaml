apiVersion: v1
kind: Service
metadata:
  name: veritas-agent
  namespace: veritas
  labels:
    app: veritas-agent
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
  selector:
    app: veritas-agent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: veritas-agent
  namespace: veritas
  labels:
    app: veritas-agent
spec:
  # The VPN node is currently single-node and this pod owns host networking.
  # Do not let a bad image automatically evict the only working agent. The
  # transactional deploy script preflights the image and rotates this pod.
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: veritas-agent
  template:
    metadata:
      labels:
        app: veritas-agent
    spec:
      hostNetwork: true
      hostPID: false
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        veritas-vpn-node: "true"
      tolerations:
        - operator: Exists
      containers:
        - name: veritas-agent
          image: localhost:31500/veritas-agent@sha256:a3e2c8af93b016ccd6dad3d72a393234a4893913062ccb5a96efe17b1523f475
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            - name: AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: AGENT_AUTH_TOKEN
            - name: MANAGER_ENDPOINT
              value: "http://wg-manager.veritas.svc.cluster.local:8080"
            - name: SERVER_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: SERVER_HOSTNAME
            - name: SERVER_REGION
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: SERVER_REGION
            - name: SERVER_CITY
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: SERVER_CITY
            - name: SERVER_COUNTRY
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: SERVER_COUNTRY
            - name: PUBLIC_IP
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: PUBLIC_IP
            - name: WG_INTERFACE
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: WG_INTERFACE
            - name: WG_PORT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: WG_PORT
            - name: WG_PUBLIC_PORT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: WG_PUBLIC_PORT
            - name: WG_PRIVATE_KEY_FILE
              value: "/etc/wireguard/private.key"
            - name: WG_SUBNET
              value: "10.0.0.0/24"
            - name: DNS_GATEWAY_IP
              value: "10.0.0.1"
            - name: EGRESS_IFACE
              value: "enp1s0"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: LOG_LEVEL
            - name: PEER_BANDWIDTH_LIMIT_MBPS
              value: "150"
            - name: DNS_LISTEN
              value: "10.0.0.1:53"
            - name: DNS_UPSTREAM
              value: "https://cloudflare-dns.com/dns-query,https://dns.google/dns-query"
            # Veritas Shield Phase 1+2 — load all category feeds; per-peer presets select policy.
            - name: DNS_SHIELD_CATEGORIES
              value: "malware,phishing,scam,crypto,trackers,ads"
            - name: DNS_BLOCKLIST_URLS_MALWARE
              value: "https://urlhaus.abuse.ch/downloads/hostfile/"
            - name: DNS_BLOCKLIST_URLS_PHISHING
              value: "https://phishing.army/download/phishing_army_blocklist_extended.txt"
            - name: DNS_BLOCKLIST_URLS_SCAM
              value: "https://hole.cert.pl/domains/domains.txt"
            - name: DNS_BLOCKLIST_URLS_CRYPTO
              value: "https://raw.githubusercontent.com/hoshsadiq/adblock-nocoin-list/master/hosts.txt"
            - name: DNS_BLOCKLIST_URLS_TRACKERS
              value: "https://small.oisd.nl/"
            - name: DNS_BLOCKLIST_URLS_ADS
              value: "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext"
            # Ops-curated escape hatch for Aggressive false positives (comma-separated domains).
            - name: DNS_SHIELD_ALLOWLIST
              value: ""
            - name: DNS_BLOCKLIST_REFRESH
              value: "6h"
            - name: DNS_BLOCKLIST_STATE_FILE
              value: "/var/lib/veritasvpn/dns/blocklist.txt"
            - name: PEER_NO_HANDSHAKE_GRACE
              value: "3m"
            # Reconnect stickiness: expire stale peers after sleep/Wi-Fi blips (~30–60m),
            # not ~5m, to cut add/remove/stale churn vs the bandwidth reconciler.
            - name: PEER_STALE_AFTER
              value: "30m"
            # hostNetwork + ClusterIP scrape (prometheus → veritas-agent:9090)
            # requires a non-loopback bind. WAN exposure is blocked by
            # deploy/node/veritas-firewall.sh (drops 9090 on the egress iface).
            # Do not use 127.0.0.1 here — it breaks up{job="veritas-agent"}.
            - name: METRICS_BIND
              value: "0.0.0.0"
            - name: METRICS_PORT
              value: "9090"
            - name: AGENT_TOKEN_FILE
              value: "/var/lib/veritasvpn/agent/token"
          ports:
            - containerPort: 9090
              name: metrics
          startupProbe:
            # Live agent image serves Prometheus on /metrics; /healthz lands with newer builds.
            # hostNetwork + loopback bind: probe localhost on the node.
            httpGet:
              path: /metrics
              port: metrics
              host: 127.0.0.1
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
              host: 127.0.0.1
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
              host: 127.0.0.1
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: wireguard
              mountPath: /etc/wireguard
              readOnly: true
            - name: dns-state
              mountPath: /var/lib/veritasvpn/dns
            - name: agent-state
              mountPath: /var/lib/veritasvpn/agent
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
      volumes:
        - name: wireguard
          hostPath:
            path: /etc/wireguard
            type: Directory
        - name: dns-state
          hostPath:
            path: /var/lib/veritasvpn/dns
            type: DirectoryOrCreate
        - name: agent-state
          hostPath:
            path: /var/lib/veritasvpn/agent
            type: DirectoryOrCreate
