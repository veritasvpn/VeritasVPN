apiVersion: v1
kind: Service
metadata:
  name: veritas-agent
  namespace: veritas
  labels:
    app: veritas-agent
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
  selector:
    app: veritas-agent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: veritas-agent
  namespace: veritas
  labels:
    app: veritas-agent
spec:
  selector:
    matchLabels:
      app: veritas-agent
  template:
    metadata:
      labels:
        app: veritas-agent
    spec:
      hostNetwork: true
      hostPID: false
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        veritas-vpn-node: "true"
      tolerations:
        - operator: Exists
      containers:
        - name: veritas-agent
          image: localhost:31500/veritas-agent@sha256:e25a86435b7b6411af7f913694e16144dad6897c731d828b1e983bde5df7d58a
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            - name: AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: AGENT_AUTH_TOKEN
            - name: MANAGER_ENDPOINT
              value: "http://wg-manager.veritas.svc.cluster.local:8080"
            - name: SERVER_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: SERVER_HOSTNAME
            - name: SERVER_REGION
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: SERVER_REGION
            - name: SERVER_CITY
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: SERVER_CITY
            - name: SERVER_COUNTRY
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: SERVER_COUNTRY
            - name: PUBLIC_IP
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: PUBLIC_IP
            - name: WG_INTERFACE
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: WG_INTERFACE
            - name: WG_PORT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: WG_PORT
            - name: WG_PUBLIC_PORT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: WG_PUBLIC_PORT
            - name: WG_PRIVATE_KEY_FILE
              value: "/etc/wireguard/private.key"
            - name: WG_SUBNET
              value: "10.0.0.0/24"
            - name: DNS_GATEWAY_IP
              value: "10.0.0.1"
            - name: EGRESS_IFACE
              value: "enp1s0"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: LOG_LEVEL
            - name: PEER_BANDWIDTH_LIMIT_MBPS
              value: "100"
            - name: DNS_LISTEN
              value: "10.0.0.1:53"
            - name: DNS_UPSTREAM
              value: "https://cloudflare-dns.com/dns-query,https://dns.google/dns-query"
            - name: DNS_BLOCKLIST_URLS
              value: "https://urlhaus.abuse.ch/downloads/hostfile/,https://phishing.army/download/phishing_army_blocklist_extended.txt"
            - name: DNS_BLOCKLIST_REFRESH
              value: "6h"
            - name: DNS_BLOCKLIST_STATE_FILE
              value: "/var/lib/veritasvpn/dns/blocklist.txt"
            - name: PEER_NO_HANDSHAKE_GRACE
              value: "3m"
            # Reconnect stickiness: expire stale peers after sleep/Wi-Fi blips (~30–60m),
            # not ~5m, to cut add/remove/stale churn vs the bandwidth reconciler.
            - name: PEER_STALE_AFTER
              value: "30m"
            # hostNetwork + in-cluster scrape require a non-loopback bind.
            # WAN/LAN exposure is blocked by deploy/node/veritas-firewall.sh.
            - name: METRICS_BIND
              value: "0.0.0.0"
            - name: METRICS_PORT
              value: "9090"
          ports:
            - containerPort: 9090
              name: metrics
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: wireguard
              mountPath: /etc/wireguard
              readOnly: true
            - name: dns-state
              mountPath: /var/lib/veritasvpn/dns
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: wireguard
          hostPath:
            path: /etc/wireguard
            type: Directory
        - name: dns-state
          hostPath:
            path: /var/lib/veritasvpn/dns
            type: DirectoryOrCreate
