apiVersion: v1
kind: Service
metadata:
  name: veritas-proxy
  namespace: veritas
  labels:
    app: veritas-proxy
spec:
  type: ClusterIP
  ports:
    - name: socks5
      port: 1080
      targetPort: 1080
  selector:
    app: veritas-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: veritas-proxy
  namespace: veritas
  labels:
    app: veritas-proxy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: veritas-proxy
  template:
    metadata:
      labels:
        app: veritas-proxy
    spec:
      containers:
        - name: veritas-proxy
          image: localhost:31500/veritas-proxy@sha256:ab5ddbef3fd013a62a1cbe067d796819de1cdcdd8128f3ab8be3f57bb41d060d
          imagePullPolicy: IfNotPresent
          env:
            # Keep JWT_SECRET until auth-svc fully issues Ed25519 access tokens.
            # The live proxy image still validates HS256 with this secret.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: JWT_SECRET
            - name: JWT_ED25519_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: JWT_ED25519_PUBLIC_KEYS
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: JWT_AUDIENCE
          ports:
            - name: socks5
              containerPort: 1080
          readinessProbe:
            tcpSocket:
              port: 1080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
