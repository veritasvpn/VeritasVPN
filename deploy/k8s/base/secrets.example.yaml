apiVersion: v1
kind: Secret
metadata:
  name: veritas-secrets
  namespace: veritas
type: Opaque
stringData:
  DB_PASSWORD: CHANGE_ME
  JWT_ED25519_PRIVATE_KEY: |-
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME
    -----END PRIVATE KEY-----
  JWT_ED25519_PUBLIC_KEYS: '{"replace-with-key-id":"-----BEGIN PUBLIC KEY-----\nCHANGE_ME\n-----END PUBLIC KEY-----\n"}'
  JWT_ACTIVE_KEY_ID: replace-with-key-id
  AGENT_AUTH_TOKEN: CHANGE_ME
  REDIS_PASSWORD: CHANGE_ME
  REDIS_URL: redis://:CHANGE_ME@redis:6379/0
  NATS_USER: CHANGE_ME
  NATS_PASSWORD: CHANGE_ME
  # One NATS credential per service, each scoped to the subjects that service
  # publishes and subscribes to. NATS rejects unauthenticated connections, so
  # every one of these must exist before the matching workload can start.
  NATS_AUTH_USER: CHANGE_ME
  NATS_AUTH_PASSWORD: CHANGE_ME
  NATS_WG_USER: CHANGE_ME
  NATS_WG_PASSWORD: CHANGE_ME
  NATS_BILLING_USER: CHANGE_ME
  NATS_BILLING_PASSWORD: CHANGE_ME
  # Subscribe-only credential for telegram-notifier.
  NATS_NOTIFIER_USER: CHANGE_ME
  NATS_NOTIFIER_PASSWORD: CHANGE_ME
  RESEND_API_KEY: CHANGE_ME
  TURNSTILE_SECRET_KEY: CHANGE_ME
  STEALTH_PATH_PREFIX: CHANGE_ME_RANDOM_HEX
# Copy this file to secrets.yaml and replace values before deploying.
# secrets.yaml is in .gitignore — never commit real credentials.
  BTCPAY_API_KEY: CHANGE_ME
  BTCPAY_STORE_ID: CHANGE_ME
  BTCPAY_WEBHOOK_SECRET: CHANGE_ME
