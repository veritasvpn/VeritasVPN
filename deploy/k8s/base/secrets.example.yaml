  name: veritas-secrets
  namespace: veritas
type: Opaque
stringData:
  DB_PASSWORD: CHANGE_ME
  JWT_SECRET: CHANGE_ME
  AGENT_AUTH_TOKEN: CHANGE_ME
  REDIS_PASSWORD: CHANGE_ME
  REDIS_URL: redis://:CHANGE_ME@redis:6379/0
