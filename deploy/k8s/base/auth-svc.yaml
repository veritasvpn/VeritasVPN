apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: veritas
  labels:
    app: auth-svc
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: auth-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-svc
  namespace: veritas
  labels:
    app: auth-svc
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: auth-svc
  template:
    metadata:
      labels:
        app: auth-svc
    spec:
      containers:
        - name: auth-svc
          image: localhost:31500/auth-svc@sha256:2f9848f73626eb1a4993caa9158558ea9914a5b8ad6c510878674a07f5c48480
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "postgres://veritas:$(DB_PASSWORD)@postgres:5432/veritas?sslmode=prefer"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: REDIS_URL
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: JWT_SECRET
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: LOG_LEVEL
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: LOG_FORMAT
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: ENVIRONMENT
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: CORS_ORIGINS
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: RESEND_API_KEY
                  optional: true
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: PUBLIC_BASE_URL
                  optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
