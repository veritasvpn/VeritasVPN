apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: veritas
  labels:
    app: auth-svc
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: auth-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-svc
  namespace: veritas
  labels:
    app: auth-svc
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: auth-svc
  template:
    metadata:
      labels:
        app: auth-svc
    spec:
      containers:
        - name: auth-svc
          image: localhost:31500/auth-svc@sha256:ac52a7c5c996c1cccc605d3a6e6f861f8eef35057696e5bdf158aa83628632bb
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "postgres://veritas:$(DB_PASSWORD)@postgres:5432/veritas?sslmode=prefer"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: NATS_URL
              value: "nats://$(NATS_USER):$(NATS_PASSWORD)@nats:4222"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: REDIS_PASSWORD
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: NATS_USER
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: NATS_PASSWORD
            - name: JWT_ED25519_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: JWT_ED25519_PRIVATE_KEY
            - name: JWT_ED25519_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: JWT_ED25519_PUBLIC_KEYS
            - name: JWT_ACTIVE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: JWT_ACTIVE_KEY_ID
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: JWT_AUDIENCE
            - name: ACCESS_TOKEN_TTL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: ACCESS_TOKEN_TTL
            - name: REFRESH_TOKEN_TTL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: REFRESH_TOKEN_TTL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: LOG_LEVEL
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: LOG_FORMAT
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: ENVIRONMENT
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: CORS_ORIGINS
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: RESEND_API_KEY
                  optional: true
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: TURNSTILE_SECRET_KEY
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: veritas-config
                  key: PUBLIC_BASE_URL
                  optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
