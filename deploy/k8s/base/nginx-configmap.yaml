apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: veritas
data:
  default.conf: |
    map $http_origin $cors_origin {
        default "";
        "https://veritasvpn.cloud"      "$http_origin";
        "https://www.veritasvpn.cloud"   "$http_origin";
        "https://api.veritasvpn.cloud"   "$http_origin";
        "http://localhost:8000"          "$http_origin";
        "http://127.0.0.1:8000"          "$http_origin";
    }

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=billing_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=provisioning_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 8000;
        server_name veritasvpn.cloud localhost;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 1m;
        client_body_timeout 10s;

        limit_conn conn_limit 20;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

        # Block direct IP/hostname access
        if ($host !~ ^(veritasvpn\.cloud|www\.veritasvpn\.cloud|api\.veritasvpn\.cloud|localhost)$) {
            return 444;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location ~* \.(css|js)$ {
            expires 5m;
            try_files $uri =404;
        }

        location ~* \.html$ {
            expires -1;
            try_files $uri =404;
        }

        location = / {
            expires -1;
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        # CORS preflight — return 204 without hitting the backend
        location ~ ^/api/v1/(auth|billing|wg)/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
                add_header Access-Control-Max-Age 86400;
                return 204;
            }
        }

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth-svc:8080/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        location /api/v1/billing/ {
            limit_req zone=billing_limit burst=5 nodelay;
            proxy_pass http://billing-svc:8080/api/v1/billing/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        location /api/v1/wg/ {
            proxy_pass http://wg-manager:8080/api/v1/wg/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        location /api/v1/agents/ {
            proxy_pass http://wg-manager:8080/api/v1/agents/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 256;
    }
