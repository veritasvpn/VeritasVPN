apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: veritas
data:
  default.conf: |
    map $http_cf_connecting_ip $rate_limit_key {
        default $binary_remote_addr;
        ~\S+   $http_cf_connecting_ip;
    }

    limit_req_zone $rate_limit_key zone=auth_limit:10m rate=5r/s;
    limit_req_zone $rate_limit_key zone=billing_limit:10m rate=10r/m;
    limit_req_zone $rate_limit_key zone=provisioning_limit:10m rate=10r/m;
    limit_conn_zone $rate_limit_key zone=conn_limit:10m;
    limit_req_zone $rate_limit_key zone=global_limit:10m rate=60r/s;

    map $http_origin $cors_origin {
        default "";
        "https://veritasvpn.cloud"    "$http_origin";
        "https://www.veritasvpn.cloud" "$http_origin";
        "tauri://localhost"            "$http_origin";
        "http://tauri.localhost"       "$http_origin";
        "https://tauri.localhost"      "$http_origin";
    }

    server {
        listen 8000;
        listen 80;
        server_name veritasvpn.cloud api.veritasvpn.cloud localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Cloudflare Tunnel terminates TLS at the edge and connects to this origin
        # over HTTP without always setting X-Forwarded-Proto. Do not force a
        # https:// redirect here — it causes a redirect loop for veritasvpn.cloud.
        # Clients always reach the public site via https:// through Cloudflare.

        limit_req zone=global_limit burst=100 nodelay;
        limit_conn conn_limit 20;
        client_max_body_size 1m;
        client_body_timeout 10s;
        client_header_timeout 10s;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Vary "Origin" always;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

        # Desktop WebViews must complete CORS preflight before auth middleware runs.
        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Binary downloads must never fall back to HTML pages.
        location /downloads/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=300";
            types {
                application/vnd.android.package-archive apk;
                application/zip zip;
                application/vnd.debian-package deb;
                application/x-executable AppImage;
            }
        }

        # Short TTL so Cloudflare/browsers pick up CSS/JS deploys (also bust ?v=).
        location ~* \.(css|js)$ {
            expires 5m;
            try_files $uri =404;
        }

        location ~* \.html$ {
            expires -1;
            try_files $uri =404;
        }

        location = / {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth-svc:8080/api/v1/auth/;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # Billing readiness is intentionally unauthenticated so monitoring can
        # distinguish Bitcoin synchronization from an unavailable billing service.
        location = /api/v1/billing/readyz {
            proxy_pass http://billing-svc:8080/readyz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 5s;
        }

        location /api/v1/billing/ {
            limit_req zone=billing_limit burst=5 nodelay;
            proxy_pass http://billing-svc:8080/api/v1/billing/;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        location /api/v1/wg/ {
            limit_req zone=provisioning_limit burst=5 nodelay;
            proxy_pass http://wg-manager:8080/api/v1/wg/;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # Agents reach wg-manager on cluster DNS (MANAGER_ENDPOINT), not the public API.
        location /api/v1/agents/ {
            return 404;
        }

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 256;
    }
