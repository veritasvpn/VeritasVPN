apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: veritas
  labels:
    app: nginx
spec:
  type: ClusterIP
  ports:
    - name: http-8000
      port: 8000
      targetPort: 8000
    - name: http-80
      port: 80
      targetPort: 8000
  selector:
    app: nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: veritas
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      # Website content is a hostPath on the control-plane node only.
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        - name: wait-for-backends
          image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -c
            - |
              for target in auth-svc:8080 billing-svc:8080 wg-manager:8080; do
                host="${target%%:*}"
                port="${target##*:}"
                until nc -z "$host" "$port"; do
                  echo "waiting for ${host}:${port}"
                  sleep 2
                done
              done
      containers:
        - name: nginx
          image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
            - name: website
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: website
          hostPath:
            path: /opt/veritasvpn/website
            type: Directory
