apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: veritas
  labels:
    app: nats
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitoring
      port: 8222
      targetPort: 8222
  selector:
    app: nats
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: veritas
  labels:
    app: nats
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      # fsGroup so the nats user owns the PVC mounted at /data.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: nats
          image: nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
          args:
            - -c
            - /etc/nats/nats-server.conf
          # nats-server.conf references these as $VAR; without them every
          # connection would be rejected at startup.
          env:
            - name: NATS_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: NATS_AUTH_USER
            - name: NATS_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: NATS_AUTH_PASSWORD
            - name: NATS_WG_USER
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: NATS_WG_USER
            - name: NATS_WG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: NATS_WG_PASSWORD
            - name: NATS_BILLING_USER
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: NATS_BILLING_USER
            - name: NATS_BILLING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: NATS_BILLING_PASSWORD
            - name: NATS_NOTIFIER_USER
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: NATS_NOTIFIER_USER
            - name: NATS_NOTIFIER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: NATS_NOTIFIER_PASSWORD
          ports:
            - containerPort: 4222
            - containerPort: 8222
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nats-config
              mountPath: /etc/nats
            - name: nats-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: nats-config
          configMap:
            name: nats-config
  volumeClaimTemplates:
    - metadata:
        name: nats-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
