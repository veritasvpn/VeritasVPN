          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nats
  namespace: veritas
spec:
  podSelector:
    matchLabels:
      app: nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth-svc
        - podSelector:
            matchLabels:
              app: wg-manager
        - podSelector:
            matchLabels:
              app: billing-svc
        - podSelector:
            matchLabels:
              app: telegram-notifier
      ports:
        - port: 4222
          protocol: TCP
      # Allow monitoring from within namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: veritas
      ports:
        - port: 8222
          protocol: TCP
---
