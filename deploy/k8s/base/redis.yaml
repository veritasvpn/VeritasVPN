apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: veritas
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: veritas
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: REDIS_PASSWORD
            # redis-cli reads this for probe AUTH without putting the password on argv.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: veritas-secrets
                  key: REDIS_PASSWORD
          # Official redis args do not expand $(REDIS_PASSWORD); use the shell so
          # requirepass matches the same secret clients already use in REDIS_URL.
          command: ["sh", "-c"]
          args:
            - exec redis-server --appendonly no --maxmemory-policy allkeys-lru --requirepass "$REDIS_PASSWORD"
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
