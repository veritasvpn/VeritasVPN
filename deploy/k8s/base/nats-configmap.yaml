apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: veritas
data:
  nats-server.conf: |
    port: 4222
    http_port: 8222

    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 64MB
      max_file_store: 256MB
    }

    max_connections: 100
    max_payload: 1MB
    max_subscriptions: 1000
