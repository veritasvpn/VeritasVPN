alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager.monitoring.svc.cluster.local:9093"]

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    installation: veritasvpn-dell

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: veritas-agent
    static_configs:
      - targets: ["veritas-agent.veritas.svc.cluster.local:9090"]

  - job_name: wg-manager
    static_configs:
      - targets: ["wg-manager.veritas.svc.cluster.local:8080"]

  - job_name: bitcoin-readiness-mainnet
    static_configs:
      - targets: ["bitcoin-readiness-mainnet.btcpay-mainnet.svc.cluster.local:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter.monitoring.svc.cluster.local:9100"]

  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics.monitoring.svc.cluster.local:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter.monitoring.svc.cluster.local:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter.monitoring.svc.cluster.local:9121"]

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://veritasvpn.cloud/
          - https://api.veritasvpn.cloud/healthz
          - https://api.veritasvpn.cloud/api/v1/billing/readyz
          - https://btcpay-mainnet.veritasvpn.cloud/
          - https://btcpay.veritasvpn.cloud/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.monitoring.svc.cluster.local:9115

  - job_name: kubernetes-cadvisor
    scheme: https
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
