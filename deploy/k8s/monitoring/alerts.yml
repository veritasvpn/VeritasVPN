groups:
  - name: veritasvpn
    rules:
      - alert: VPNMetricsUnavailable
        expr: up{job="veritas-agent"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "VeritasVPN agent metrics are unavailable"
      - alert: PublicWebsiteUnavailable
        expr: probe_success{instance="https://veritasvpn.cloud/"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "veritasvpn.cloud is unavailable"
      - alert: PublicAPIUnavailable
        expr: probe_success{instance="https://api.veritasvpn.cloud/healthz"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "VeritasVPN API is unavailable"
      - alert: BTCPayUnavailable
        expr: probe_success{instance="https://btcpay.veritasvpn.cloud/"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "BTCPay payment page is unavailable"
      - alert: DellDiskFilling
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Dell root disk usage exceeds 85%"
      - alert: DellMemoryPressure
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Dell memory usage exceeds 90%"
      - alert: KubernetesContainerRestarting
        expr: increase(kube_pod_container_status_restarts_total{namespace="veritas"}[15m]) > 2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "A VeritasVPN container is repeatedly restarting"
      - alert: WireGuardPeersNotHandshaking
        expr: veritas_agent_peer_count > 0 and veritas_agent_active_peer_count == 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Configured WireGuard peers have no recent handshakes"
      - alert: PrometheusScrapeMissing
        expr: absent(up{job="veritas-agent"}) or absent(up{job="blackbox"})
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "A required VeritasVPN monitoring scrape is missing"

      - alert: BitcoinNodeNotReady
        expr: kube_statefulset_status_replicas_ready{namespace="btcpay",statefulset="bitcoind"} < 1
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Bitcoin node is not ready"
      - alert: CloudflareTunnelNotReady
        expr: kube_deployment_status_replicas_ready{namespace="ingress-nginx",deployment="cloudflared"} < 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Cloudflare Tunnel connector is not ready"

      - alert: BitcoinNodeSynchronizing
        expr: bitcoin_initial_block_download{job="bitcoin-readiness"} == 1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Bitcoin node is still synchronizing"
          description: "Bitcoin is in initial block download; Bitcoin checkouts remain gated until readiness is verified."
      - alert: BitcoinRPCUnavailable
        expr: bitcoin_rpc_up{job="bitcoin-readiness"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Bitcoin RPC is unavailable"
          description: "The readiness service cannot reach Bitcoin Core. Payment readiness cannot be evaluated."
      - alert: BitcoinSyncStalled
        expr: bitcoin_initial_block_download{job="bitcoin-readiness"} == 1 and changes(bitcoin_blocks{job="bitcoin-readiness"}[30m]) == 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Bitcoin synchronization appears stalled"
          description: "Bitcoin block height has not advanced for 30 minutes while initial synchronization is active."
      - alert: BillingReadinessUnavailable
        expr: probe_success{instance="https://api.veritasvpn.cloud/api/v1/billing/readyz"} == 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Bitcoin billing readiness is unavailable"
          description: "The billing readiness endpoint is unavailable; checkout is intentionally gated until Bitcoin is healthy."
      - alert: BitcoinHeaderLag
        expr: (bitcoin_headers - bitcoin_blocks) > 6
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Bitcoin node is behind its advertised chain tip"
          description: "Bitcoin block validation is more than six headers behind."

      - alert: VeritasBackupStale
        expr: time() - veritas_backup_last_success_timestamp > 172800
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "Encrypted VeritasVPN backup is stale"
          description: "No backup has passed restore validation in the last 48 hours."
      - alert: VeritasOffsiteBackupStale
        expr: time() - veritas_backup_offsite_last_success_timestamp > 172800
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "Off-site VeritasVPN backup is stale"
          description: "No encrypted backup has been uploaded and verified in R2 in the last 48 hours."
