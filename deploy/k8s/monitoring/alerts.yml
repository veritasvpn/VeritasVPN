groups:
  - name: veritasvpn
    rules:
      - alert: VPNMetricsUnavailable
        expr: up{job="veritas-agent"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "VeritasVPN agent metrics are unavailable"
      - alert: PublicWebsiteUnavailable
        expr: probe_success{instance="https://veritasvpn.cloud/"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "veritasvpn.cloud is unavailable"
      - alert: PublicAPIUnavailable
        expr: probe_success{instance="https://api.veritasvpn.cloud/healthz"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "VeritasVPN API is unavailable"
      - alert: PublicAPILatencyHigh
        expr: probe_duration_seconds{instance="https://api.veritasvpn.cloud/healthz"} > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "VeritasVPN API latency exceeds two seconds"
      - alert: PublicTLSCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry{job="blackbox"} - time() < 1209600
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "A public VeritasVPN TLS certificate expires within 14 days"
      - alert: BTCPayUnavailable
        expr: probe_success{instance="http://btcpayserver-mainnet.btcpay-mainnet.svc.cluster.local:49392/"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "In-cluster BTCPay mainnet is unavailable"
          description: "Blackbox probes the cluster service (not the Cloudflare Access public URL)."
      - alert: StealthTunnelUnavailable
        # In-cluster probes of the public WAN IP often fail hairpin NAT; LAN/node
        # reachability is the reliable signal that wstunnel is listening.
        expr: count(probe_success{job="blackbox-stealth"} == 1) == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Stealth TLS listener (wstunnel :443) is unavailable"
          description: "No blackbox-stealth target succeeded (LAN/node TLS on :443)."

      - alert: DellDiskFilling
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Dell root disk usage exceeds 85%"
      - alert: DellDiskCapacityReserveLow
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) > 75
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Dell disk capacity reserve is below 25%"
          description: "Local Kubernetes volumes share the Dell root disk. Investigate growth before the critical 85% threshold."
      - alert: KubernetesPersistentVolumeNearCapacity
        expr: 100 * (1 - kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) > 85
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "A Kubernetes persistent volume is above 85% utilization"
          description: "Inspect the affected volume before it can disrupt payment, database, monitoring, or registry workloads."
      - alert: DellMemoryPressure
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Dell memory usage exceeds 90%"
      - alert: KubernetesContainerRestarting
        # Only alert while the pod still exists (avoids sticky alerts after a CrashLoop pod is deleted).
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace=~"veritas|btcpay|btcpay-mainnet|ingress-nginx"}[15m]) > 2
          and on(namespace, pod) kube_pod_info
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is repeatedly restarting"
          description: "Investigate CrashLoopBackOff, OOM, or missing env (e.g. JWT_ED25519_PUBLIC_KEYS). increase(restarts[15m]) > 2."
      - alert: KubernetesContainerOOMKilled
        expr: kube_pod_container_status_last_terminated_reason{namespace=~"veritas|btcpay|btcpay-mainnet|ingress-nginx",reason="OOMKilled"} == 1 and increase(kube_pod_container_status_restarts_total{namespace=~"veritas|btcpay|btcpay-mainnet|ingress-nginx"}[1h]) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "A production container was OOM-killed"
          description: "A workload exceeded its memory limit and was terminated."
      - alert: ContainerImagePullFailure
        expr: kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"} > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "A container image cannot be pulled"
          description: "A Kubernetes workload is waiting because its image is unavailable."
      - alert: WireGuardStalePeers
        expr: veritas_agent_stale_peer_count > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "WireGuard peers are awaiting expiry"
          description: "A peer stopped sending keepalives and could not yet be reconciled with the manager."
      - alert: WireGuardOrphanPeers
        expr: veritas_agent_orphan_peer_count > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "WireGuard has unmanaged kernel peers"
          description: "A kernel peer is not represented by the manager stream and will be removed after the reconciliation grace period."
      - alert: WireGuardPeerStreamDisconnected
        expr: veritas_agent_peer_stream_connected == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "VeritasVPN agent peer update stream is disconnected"
          description: "The agent is not receiving peer provisioning events from wg-manager."

      - alert: WireGuardPeerStreamFrequentDisconnects
        expr: increase(veritas_agent_peer_stream_disconnects_total[15m]) > 3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "VeritasVPN agent peer stream is reconnecting frequently"
          description: "Repeated SSE disconnects may delay peer add/remove on the VPN node."

      - alert: WireGuardManagerPostgresUnavailable
        expr: veritas_wg_manager_postgres_up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "wg-manager cannot reach PostgreSQL"
          description: "Peer provisioning and VPN configuration depend on postgres availability."

      - alert: WireGuardPeerExpiryFailures
        expr: increase(veritas_agent_peer_expiry_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "WireGuard stale-peer cleanup is failing"
          description: "The agent cannot reconcile stale WireGuard peers with the manager; reconnect reliability may degrade."
      - alert: PrometheusScrapeMissing
        expr: absent(up{job="veritas-agent"}) or absent(up{job="blackbox"})
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "A required VeritasVPN monitoring scrape is missing"
      - alert: AlertmanagerUnavailable
        expr: up{job="prometheus"} == 1 and prometheus_notifications_alertmanagers_discovered < 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Prometheus cannot discover Alertmanager"

      - alert: BitcoinReadinessServiceUnavailable
        expr: up{job="bitcoin-readiness-mainnet"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Bitcoin readiness service is unavailable"
          description: "The Bitcoin readiness exporter cannot be scraped; payment readiness cannot be evaluated."
      - alert: CloudflareTunnelNotReady
        expr: kube_deployment_status_replicas_ready{namespace="ingress-nginx",deployment="cloudflared"} < 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Cloudflare Tunnel connector is not ready"

      - alert: BitcoinNodeSynchronizing
        expr: bitcoin_initial_block_download{job="bitcoin-readiness-mainnet"} == 1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Bitcoin node is still synchronizing"
          description: "Bitcoin is in initial block download; Bitcoin checkouts remain gated until readiness is verified."
      - alert: BitcoinRPCUnavailable
        expr: bitcoin_rpc_up{job="bitcoin-readiness-mainnet"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Bitcoin RPC is unavailable"
          description: "The readiness service cannot reach Bitcoin Core. Payment readiness cannot be evaluated."
      - alert: BitcoinSyncStalled
        expr: bitcoin_initial_block_download{job="bitcoin-readiness-mainnet"} == 1 and changes(bitcoin_blocks{job="bitcoin-readiness-mainnet"}[30m]) == 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Bitcoin synchronization appears stalled"
          description: "Bitcoin block height has not advanced for 30 minutes while initial synchronization is active."
      - alert: BillingReadinessRouteBroken
        expr: probe_http_status_code{instance="https://api.veritasvpn.cloud/api/v1/billing/readyz"} == 404
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Public billing readiness route is broken"
          description: "The monitoring endpoint returned 404 instead of billing readiness."
      - alert: BillingReadinessUnavailable
        expr: probe_success{instance="https://api.veritasvpn.cloud/api/v1/billing/readyz"} == 0 and bitcoin_initial_block_download{job="bitcoin-readiness-mainnet"} == 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Bitcoin billing readiness is unavailable"
          description: "The billing readiness endpoint is unavailable; checkout is intentionally gated until Bitcoin is healthy."
      - alert: BitcoinHeaderLag
        expr: (bitcoin_headers{job="bitcoin-readiness-mainnet"} - bitcoin_blocks{job="bitcoin-readiness-mainnet"}) > 6
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Bitcoin node is behind its advertised chain tip"
          description: "Bitcoin block validation is more than six headers behind."

      - alert: BitcoinReadinessExporterStale
        expr: time() - bitcoin_last_successful_refresh_timestamp_seconds{job="bitcoin-readiness-mainnet"} > 120
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Bitcoin readiness exporter is stale"
          description: "The exporter has not completed a successful Bitcoin RPC refresh in over two minutes."
      - alert: KubernetesDNSUnavailableFromPaymentPlane
        expr: min(kubernetes_dns_up{job=~"bitcoin-readiness|bitcoin-readiness-mainnet"}) < 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Kubernetes DNS is unavailable from the payment plane"
          description: "A Bitcoin readiness workload cannot resolve kubernetes.default through kube-dns. RPC uses a Service-IP fallback, but cluster DNS needs repair."
      - alert: BitcoinMainnetReadinessExporterStale
        expr: time() - bitcoin_last_successful_refresh_timestamp_seconds{job="bitcoin-readiness-mainnet"} > 120
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Mainnet Bitcoin readiness exporter is stale"
          description: "The mainnet exporter has not completed a successful Bitcoin RPC refresh in over two minutes."
      - alert: BitcoinMainnetSyncStalled
        expr: bitcoin_initial_block_download{job="bitcoin-readiness-mainnet"} == 1 and changes(bitcoin_blocks{job="bitcoin-readiness-mainnet"}[30m]) == 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Mainnet Bitcoin synchronization appears stalled"
          description: "Mainnet block height has not advanced for 30 minutes while initial synchronization is active."
      - alert: BitcoinMainnetHeaderLag
        expr: (bitcoin_headers{job="bitcoin-readiness-mainnet"} - bitcoin_blocks{job="bitcoin-readiness-mainnet"}) > 6
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Mainnet Bitcoin node is behind its advertised chain tip"
          description: "Mainnet block validation is more than six headers behind."
      - alert: BitcoinMainnetRPCUnavailable
        expr: bitcoin_rpc_up{job="bitcoin-readiness-mainnet"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Mainnet Bitcoin RPC is unavailable"
          description: "The mainnet readiness exporter cannot reach Bitcoin Core."
      - alert: MainnetNBXplorerRestarting
        expr: increase(kube_pod_container_status_restarts_total{namespace="btcpay-mainnet",pod=~"nbxplorer-mainnet-0"}[15m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Mainnet NBXplorer restarted"
          description: "NBXplorer restarted while tracking the mainnet payment stack."
      - alert: VeritasBackupStale
        expr: time() - veritas_backup_last_success_timestamp > 172800
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "Encrypted VeritasVPN backup is stale"
          description: "No backup has passed restore validation in the last 48 hours."
      - alert: VeritasBackupArchiveTooSmall
        # Healthy small DBs produce ~100KB encrypted archives; 50KB catches empty/truncated packs.
        expr: veritas_backup_archive_bytes > 0 and veritas_backup_archive_bytes < 50000
        for: 12h
        labels: { severity: warning }
        annotations:
          summary: "VeritasVPN backup archive is unexpectedly small"
          description: "Archive under 50KB may mean dumps were skipped or truncated. Check deploy/backup/backup-k3s.sh."
      - alert: VeritasOffsiteBackupStale
        expr: time() - veritas_backup_offsite_last_success_timestamp > 172800
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "Off-site VeritasVPN backup is stale"
          description: "No encrypted backup has been uploaded and verified in R2 in the last 48 hours."
      - alert: VeritasBackupRestoreRehearsalStale
        expr: absent(veritas_backup_restore_rehearsal_last_success_timestamp) or time() - veritas_backup_restore_rehearsal_last_success_timestamp > 172800
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "VeritasVPN backup restore rehearsal is stale"
          description: "No isolated encrypted-backup restore rehearsal has succeeded in the last 48 hours."
      - alert: DellSMARTFailing
        expr: veritas_hardware_smart_available == 1 and veritas_hardware_smart_healthy == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Dell storage reports an unhealthy SMART state"
      - alert: DellThermalWarning
        expr: veritas_hardware_max_temperature_celsius > 75
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Dell temperature is above 75°C"
      - alert: DellThermalCritical
        expr: veritas_hardware_max_temperature_celsius > 85
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Dell temperature is above 85°C"
      - alert: DNSBlocklistStale
        expr: veritas_agent_dns_blocklist_last_successful_refresh_timestamp_seconds > 0 and time() - veritas_agent_dns_blocklist_last_successful_refresh_timestamp_seconds > 43200
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "VeritasVPN DNS malware/phishing blocklist has not refreshed in 12 hours"
      - alert: DNSUpstreamsFailing
        expr: increase(veritas_agent_dns_upstream_failures_total[10m]) > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "VeritasVPN encrypted DNS upstreams are repeatedly failing"
