apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: veritas

resources:
  - ../../base

images:
  - name: localhost:31500/auth-svc
    newName: localhost:31500/auth-svc
    digest: sha256:ad4a05eb67aafbad86d80e6d77893d8194055155f3d592f147d00c15331f67c9
  - name: localhost:31500/wg-manager
    newName: localhost:31500/wg-manager
    digest: sha256:18142a2380d60d83a1f78e2815b075bf0be0ea91bfffefcbac54f0fd79792686
  - name: localhost:31500/billing-svc
    newName: localhost:31500/billing-svc
    digest: sha256:891bcca9d15113915b0641b7781cc07dfd954fbaeab715676662ba632efa0abf
  - name: localhost:31500/veritas-agent
    newName: localhost:31500/veritas-agent
    digest: sha256:c531dfa9dc0f88bb57aeb2afb68299f893e4b840905c9a3787fbdd415712be90
  - name: localhost:31500/veritas-proxy
    newName: localhost:31500/veritas-proxy
    digest: sha256:735d0c4463bf3f0e87133f5e62e17749bb47efe7d83d9daac9c7e9c8c9ce7579
  - name: localhost:31500/telegram-notifier
    newName: localhost:31500/telegram-notifier
    digest: sha256:df9540aaa1f516075c360efb19b0a1c12ba20b370fc10da765b5a534dbca8698


patches:
  - target:
      kind: ConfigMap
      name: veritas-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: "production"
      - op: replace
        path: /data/LOG_LEVEL
        value: "info"
      - op: replace
        path: /data/LOG_FORMAT
        value: "json"
      - op: replace
        path: /data/CORS_ORIGINS
        value: "https://veritasvpn.cloud,https://www.veritasvpn.cloud"
      - op: replace
        path: /data/ALLOW_MOCK_BTCPAY
        value: "false"
      - op: replace
        path: /data/CHECKOUT_SUCCESS_URL
        value: "https://veritasvpn.cloud/billing/success.html"
      - op: replace
        path: /data/CHECKOUT_CANCEL_URL
        value: "https://veritasvpn.cloud/billing/cancel.html"
      - op: replace
        path: /data/SERVER_HOSTNAME
        value: "veritas-node"
      - op: replace
        path: /data/PUBLIC_IP
        value: "170.51.31.139"
      - op: replace
        path: /data/STEALTH_ENABLED
        value: "true"
      - op: replace
        path: /data/STEALTH_ENDPOINT_HOST
        value: "170.51.31.139"
      - op: replace
        path: /data/STEALTH_ENDPOINT_PORT
        value: "443"
      - op: replace
        path: /data/SERVER_COUNTRY
        value: "PY"
      - op: replace
        path: /data/SERVER_CITY
        value: "asuncion"
      - op: replace
        path: /data/BITCOIN_READINESS_URL
        value: "http://bitcoin-readiness-mainnet.btcpay-mainnet.svc.cluster.local:8080/readyz"
      - op: replace
        path: /data/BTCPAY_SERVER_URL
        value: "http://btcpayserver-mainnet.btcpay-mainnet.svc.cluster.local:49392"
      - op: replace
        path: /data/BTCPAY_PUBLIC_URL
        value: "https://btcpay-mainnet.veritasvpn.cloud"

  # Auth env with Redis/NATS auth
  - target:
      kind: Deployment
      name: auth-svc
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "nats://$(NATS_USER):$(NATS_PASSWORD)@nats:4222"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: REDIS_PASSWORD
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NATS_USER
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: NATS_USER
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NATS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: NATS_PASSWORD

  # WG-Manager env with Redis/NATS auth
  - target:
      kind: Deployment
      name: wg-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "nats://$(NATS_USER):$(NATS_PASSWORD)@nats:4222"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: REDIS_PASSWORD
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NATS_USER
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: NATS_USER
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NATS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: NATS_PASSWORD

  # Billing env with NATS auth
  - target:
      kind: Deployment
      name: billing-svc
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "nats://$(NATS_USER):$(NATS_PASSWORD)@nats:4222"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NATS_USER
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: NATS_USER
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NATS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: NATS_PASSWORD
