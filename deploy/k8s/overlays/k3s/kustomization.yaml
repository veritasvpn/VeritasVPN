apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: veritas

resources:
  - ../../base

images:
  - name: localhost:31500/auth-svc
    newName: localhost:31500/auth-svc
    digest: sha256:4690c3c6fed68ed75d3fc88f7a5f4e658712021d2f50cac65eec7194847c4ebe
  - name: localhost:31500/wg-manager
    newName: localhost:31500/wg-manager
    digest: sha256:be4655a4df93a2fa329d5ba95994314ddcbfa6f9cf421a3f66cb316916bac157
  - name: localhost:31500/billing-svc
    newName: localhost:31500/billing-svc
    digest: sha256:f0f79c16b3c2f28e8339409397f510907787e0e811358490558d2d3667f21efe
  - name: localhost:31500/veritas-agent
    newName: localhost:31500/veritas-agent
    digest: sha256:2c4ea2eb7e744f59da0dbc83afd4c8395febe946c1ee90ebe6e2dba0c732a30f
  - name: localhost:31500/wstunnel
    newName: localhost:31500/wstunnel
    digest: sha256:54ed252229d1e29505d2b59e3bf05b77c7038939a87646c27f4267853a4a8f3b
  - name: localhost:31500/veritas-proxy
    newName: localhost:31500/veritas-proxy
    digest: sha256:df02b5d35129d6f694d36649110b11346f1d8249dcd831b5106d67fcccbcc4bf
  - name: localhost:31500/telegram-notifier
    newName: localhost:31500/telegram-notifier
    digest: sha256:c65ec535ef7e6e6aaec053520b0807a9aa7a8ab53b4a717d6aa69522d46d69af


patches:
  - target:
      kind: ConfigMap
      name: veritas-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: "production"
      - op: replace
        path: /data/LOG_LEVEL
        value: "info"
      - op: replace
        path: /data/LOG_FORMAT
        value: "json"
      - op: replace
        path: /data/CORS_ORIGINS
        value: "https://veritasvpn.cloud,https://www.veritasvpn.cloud,tauri://localhost,https://tauri.localhost,http://tauri.localhost"
      - op: replace
        path: /data/ALLOW_MOCK_BTCPAY
        value: "false"
      - op: replace
        path: /data/CHECKOUT_SUCCESS_URL
        value: "https://veritasvpn.cloud/billing/success.html"
      - op: replace
        path: /data/CHECKOUT_CANCEL_URL
        value: "https://veritasvpn.cloud/billing/cancel.html"
      - op: replace
        path: /data/SERVER_HOSTNAME
        value: "veritas-node"
      # PUBLIC_IP placeholders — replace via private site overlay before apply (see SITE_LOCAL.md).
      - op: replace
        path: /data/PUBLIC_IP
        value: "REPLACE_ME_PUBLIC_IP"
      - op: replace
        path: /data/BROWSER_PROXY_HOST
        value: "REPLACE_ME_PUBLIC_IP"
      - op: replace
        path: /data/BROWSER_EXPECTED_EGRESS_IP
        value: "REPLACE_ME_PUBLIC_IP"
      - op: replace
        path: /data/STEALTH_ENABLED
        value: "true"
      - op: replace
        path: /data/STEALTH_ENDPOINT_HOST
        value: "REPLACE_ME_PUBLIC_IP"
      - op: replace
        path: /data/STEALTH_ENDPOINT_PORT
        value: "443"
      - op: replace
        path: /data/SERVER_COUNTRY
        value: "PY"
      - op: replace
        path: /data/SERVER_CITY
        value: "asuncion"
      - op: replace
        path: /data/BITCOIN_READINESS_URL
        value: "http://bitcoin-readiness-mainnet.btcpay-mainnet.svc.cluster.local:8080/readyz"
      - op: replace
        path: /data/BTCPAY_SERVER_URL
        value: "http://btcpayserver-mainnet.btcpay-mainnet.svc.cluster.local:49392"
      - op: replace
        path: /data/BTCPAY_PUBLIC_URL
        value: "https://btcpay-mainnet.veritasvpn.cloud"

  # Redis/NATS auth env vars live in base manifests (auth-svc, wg-manager, billing-svc).
  # Do not JSON-patch env value/valueFrom here — that creates invalid dual fields on apply.
