apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: veritas

resources:
  - ../../base

images:
  - name: localhost:31500/auth-svc
    newName: 192.168.0.5:30500/auth-svc
    digest: sha256:45a6f1a962abacb0eb52c529e9a3355c78d49b7dd4300aef4945344334b5c073
  - name: localhost:31500/wg-manager
    newName: 192.168.0.5:30500/wg-manager
    digest: sha256:ec33cc94485723b36eed42318a86650dbd4d28a04bd366fb2e73d49f0ff55e61
  - name: localhost:31500/billing-svc
    newName: 192.168.0.5:30500/billing-svc
    digest: sha256:72ef4de5fd40962028558683732b51bf12239d7479e6e49dd49cbea2484ed153
  - name: localhost:31500/veritas-agent
    newName: 192.168.0.5:30500/veritas-agent
    digest: sha256:a1c1cab57c87013d4a00d3324693f3b372556263722a069f2d947deae4c900cd
  - name: localhost:31500/veritas-proxy
    newName: 192.168.0.5:30500/veritas-proxy
    digest: sha256:735d0c4463bf3f0e87133f5e62e17749bb47efe7d83d9daac9c7e9c8c9ce7579

patches:
  - target:
      kind: ConfigMap
      name: veritas-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: "production"
      - op: replace
        path: /data/LOG_LEVEL
        value: "info"
      - op: replace
        path: /data/LOG_FORMAT
        value: "json"
      - op: replace
        path: /data/CORS_ORIGINS
        value: "https://veritasvpn.cloud,https://www.veritasvpn.cloud"
      - op: replace
        path: /data/ALLOW_MOCK_BTCPAY
        value: "false"
      - op: replace
        path: /data/CHECKOUT_SUCCESS_URL
        value: "https://veritasvpn.cloud/billing/success.html"
      - op: replace
        path: /data/CHECKOUT_CANCEL_URL
        value: "https://veritasvpn.cloud/billing/cancel.html"
      - op: replace
        path: /data/SERVER_HOSTNAME
        value: "veritas-node"
      - op: replace
        path: /data/SERVER_COUNTRY
        value: "PY"
      - op: replace
        path: /data/SERVER_CITY
        value: "asuncion"

  # -- Restrict non-agent workloads to the Pi (ARM64 images) --
  - target:
      kind: Deployment
      labelSelector: "app!=registry"
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: veritas-node

  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: veritas-node

  # -- Add imagePullSecrets to all workloads --
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: regcred

  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: regcred

  - target:
      kind: DaemonSet
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: regcred

  # Redis/NATS auth env (including $(VAR) expansion order) lives in base manifests.

  # -- Remove liveness probes to let services stabilize --
  - target:
      kind: Deployment
      name: auth-svc
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
  - target:
      kind: Deployment
      name: wg-manager
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
  - target:
      kind: Deployment
      name: billing-svc
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
  - target:
      kind: Deployment
      name: nginx
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
  - target:
      kind: StatefulSet
      name: nats
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
  - target:
      kind: DaemonSet
      name: veritas-agent
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
