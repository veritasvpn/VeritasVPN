apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: veritas

resources:
  - ../../base

# Local k3s registry (NodePort 31500). Images are built/imported by
# deploy/k8s/scripts/import-images.sh during cutover.
images:
  - name: localhost:31500/auth-svc
    newName: localhost:31500/auth-svc
    digest: sha256:606fd788562949b75c5e11135c77a3445c281d45003e9d781780e61ab88e0f77
  - name: localhost:31500/wg-manager
    newName: localhost:31500/wg-manager
    digest: sha256:b87d146614bca0307a2dcb17c80fa84459db3d3c8fd433fd468196b43f26c5ce
  - name: localhost:31500/billing-svc
    newName: localhost:31500/billing-svc
    digest: sha256:267b947ce72f0b944fbe2f010b7335fbf4ae3b6c7533843653635f2bfc520257
  - name: localhost:31500/veritas-agent
    newName: localhost:31500/veritas-agent
    digest: sha256:a4bea87884e7053e95dd927c2a43f555e30e027d2430e497de36b97acd57e724
  - name: localhost:31500/veritas-proxy
    newName: localhost:31500/veritas-proxy
    digest: sha256:735d0c4463bf3f0e87133f5e62e17749bb47efe7d83d9daac9c7e9c8c9ce7579
  - name: localhost:31500/telegram-notifier
    newName: localhost:31500/telegram-notifier
    digest: sha256:df9540aaa1f516075c360efb19b0a1c12ba20b370fc10da765b5a534dbca8698

patches:
  # -- ConfigMap: production defaults for this host --
  - target:
      kind: ConfigMap
      name: veritas-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: "production"
      - op: replace
        path: /data/LOG_LEVEL
        value: "info"
      - op: replace
        path: /data/LOG_FORMAT
        value: "json"
      - op: replace
        path: /data/CORS_ORIGINS
        value: "https://veritasvpn.cloud,https://www.veritasvpn.cloud"
      - op: replace
        path: /data/ALLOW_MOCK_BTCPAY
        value: "false"
      - op: replace
        path: /data/PREMIUM_PRICE_USD_CENTS
        value: "300"
      - op: replace
        path: /data/CHECKOUT_SUCCESS_URL
        value: "https://veritasvpn.cloud/account/#/subscription"
      - op: replace
        path: /data/CHECKOUT_CANCEL_URL
        value: "https://veritasvpn.cloud/account/#/subscription"
      - op: replace
        path: /data/SERVER_HOSTNAME
        value: "delloptiplex-3060"
      - op: replace
        path: /data/SERVER_REGION
        value: "sa"
      - op: replace
        path: /data/SERVER_COUNTRY
        value: "PY"
      - op: replace
        path: /data/SERVER_CITY
        value: "asuncion"
      - op: replace
        path: /data/PUBLIC_IP
        value: "186.122.244.166"
      - op: replace
        path: /data/BITCOIN_READINESS_URL
        value: "http://bitcoin-readiness.btcpay.svc.cluster.local:8080/readyz"
      - op: replace
        path: /data/BTCPAY_SERVER_URL
        value: "http://btcpayserver.btcpay.svc.cluster.local:49392"
      - op: replace
        path: /data/BTCPAY_PUBLIC_URL
        value: "https://btcpay.veritasvpn.cloud"
      - op: replace
        path: /data/MANAGER_ENDPOINT
        value: "http://wg-manager.veritas.svc.cluster.local:8080"

  # -- Redis: requirepass + auth probes (single replica; clustered redis needs sentinel/cluster) --
  - target:
      kind: Deployment
      name: redis
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--requirepass"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "$(REDIS_PASSWORD)"
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: veritas-secrets
                key: REDIS_PASSWORD
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/exec/command
        value: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/exec/command
        value: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop: ["ALL"]

  # -- Auth: Redis/NATS auth + securityContext --
  - target:
      kind: Deployment
      name: auth-svc
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "nats://nats:4222"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: REDIS_PASSWORD
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NATS_USER
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: NATS_USER
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NATS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: NATS_PASSWORD
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # -- WG-Manager: Redis/NATS auth + securityContext --
  - target:
      kind: Deployment
      name: wg-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "nats://nats:4222"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: REDIS_PASSWORD
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NATS_USER
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: NATS_USER
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NATS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: NATS_PASSWORD
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # -- Billing: NATS auth + BTCPay secrets + securityContext --
  - target:
      kind: Deployment
      name: billing-svc
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "nats://nats:4222"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NATS_USER
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: NATS_USER
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NATS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: veritas-secrets
              key: NATS_PASSWORD
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # -- nginx: securityContext + tmp volumes --
  - target:
      kind: Deployment
      name: nginx
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            drop: ["ALL"]
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: nginx-tmp
          mountPath: /tmp
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: nginx-cache
          mountPath: /var/cache/nginx
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: nginx-run
          mountPath: /var/run
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: nginx-tmp
          emptyDir: {}
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: nginx-cache
          emptyDir: {}
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: nginx-run
          emptyDir: {}

  # -- veritas-proxy: least-privilege security context --
  - target:
      kind: Deployment
      name: veritas-proxy
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # -- veritas-agent: pull policy --
  - target:
      kind: DaemonSet
      name: veritas-agent
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent


  # -- nats securityContext --
  - target:
      kind: StatefulSet
      name: nats
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
