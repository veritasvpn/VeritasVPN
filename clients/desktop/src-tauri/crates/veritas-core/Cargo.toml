[package]
name = "veritas-core"
version = "0.2.99"
edition = "2021"
publish = false
description = "Shared tunnel config checks, reconnect policy, and WireGuard key helpers"

[dependencies]
base64 = "0.22.1"
hex = "0.4.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
