[workspace]
members = [".", "crates/veritas-core", "crates/veritas-ipc", "crates/veritas-service"]
resolver = "2"

[package]
name = "veritasvpn-desktop"
version = "0.2.99"
description = "VeritasVPN Desktop App"
authors = ["VeritasVPN"]
edition = "2021"

[lib]
name = "veritasvpn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.4", features = [] }
tauri-plugin-http = "~2.8.3"
tauri-plugin-notification = "~2.7.0"
tauri-plugin-opener = "~2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2.0.0"
base64 = "0.22.1"
keyring = "4.1.6"
veritas-core = { path = "crates/veritas-core" }
veritas-ipc = { path = "crates/veritas-ipc" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Pipes",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
glib = { path = "../../../third_party/rust/glib-0.18.5" }
