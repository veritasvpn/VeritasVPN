# XcodeGen spec. Generate the project with:
#   brew install xcodegen && xcodegen generate
# The generated VeritasVPN.xcodeproj is git-ignored.
name: VeritasVPN
options:
  bundleIdPrefix: cloud.veritasvpn
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  WireGuardKit:
    url: https://git.zx2c4.com/wireguard-apple
    # Tag 1.0.16-27 (pinned by commit; the tag is not SemVer).
    revision: 2fec12a6e1f6e3460b6ee483aa00ad29cddadab1
  VeritasCore:
    path: Packages/VeritasCore

targets:
  # wireguard-go bridge (libwg-go.a), External Build System targets as
  # documented by wireguard-apple. One per platform so ARCHS/SDK match.
  WireGuardGoBridge-iOS:
    type: ""
    platform: iOS
    legacy:
      toolPath: /bin/sh
      arguments: "$(SRCROOT)/Scripts/build-wireguard-go-bridge.sh $(ACTION)"
      passSettings: true
      workingDirectory: ""
    settings:
      base:
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  WireGuardGoBridge-macOS:
    type: ""
    platform: macOS
    legacy:
      toolPath: /bin/sh
      arguments: "$(SRCROOT)/Scripts/build-wireguard-go-bridge.sh $(ACTION)"
      passSettings: true
      workingDirectory: ""
    settings:
      base:
        SDKROOT: macosx

  VeritasVPN-iOS:
    type: application
    platform: iOS
    sources:
      - path: VeritasVPN
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: VeritasVPN
        PRODUCT_BUNDLE_IDENTIFIER: $(VERITAS_APP_BUNDLE_ID)
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/VeritasVPN.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - package: VeritasCore
      - target: PacketTunnel-iOS
        embed: true
        codeSign: true

  PacketTunnel-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel/Sources
    settings:
      base:
        PRODUCT_NAME: PacketTunnel
        PRODUCT_MODULE_NAME: PacketTunnel
        PRODUCT_BUNDLE_IDENTIFIER: $(VERITAS_TUNNEL_BUNDLE_ID)
        INFOPLIST_FILE: PacketTunnel/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/iOS/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LIBRARY_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
    dependencies:
      - target: WireGuardGoBridge-iOS
      - package: WireGuardKit
      - package: VeritasCore
      - sdk: NetworkExtension.framework

  VeritasVPN-macOS:
    type: application
    platform: macOS
    sources:
      - path: VeritasVPN
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: VeritasVPN
        PRODUCT_BUNDLE_IDENTIFIER: $(VERITAS_APP_BUNDLE_ID)
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/VeritasVPN.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - package: VeritasCore
      - target: PacketTunnel-macOS
        embed: true
        codeSign: true

  PacketTunnel-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: PacketTunnel/Sources
    settings:
      base:
        PRODUCT_NAME: PacketTunnel
        PRODUCT_MODULE_NAME: PacketTunnel
        PRODUCT_BUNDLE_IDENTIFIER: $(VERITAS_TUNNEL_BUNDLE_ID)
        INFOPLIST_FILE: PacketTunnel/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/macOS/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
        LIBRARY_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
    dependencies:
      - target: WireGuardGoBridge-macOS
      - package: WireGuardKit
      - package: VeritasCore
      - sdk: NetworkExtension.framework

schemes:
  VeritasVPN-iOS:
    build:
      targets:
        VeritasVPN-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  VeritasVPN-macOS:
    build:
      targets:
        VeritasVPN-macOS: all
    run:
      config: Debug
    archive:
      config: Release
